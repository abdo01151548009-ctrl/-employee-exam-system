<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Employee Exam System</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
  --brand:#2563eb; --brand-d:#1d4ed8; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1420; --surface:#171d2b; --text:#e5e7eb; --muted:#9aa4b2; --border:#2a3242; }
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--surface);border-left:1px solid var(--border);padding:16px;flex-shrink:0}
.sidebar h2{font-size:16px;color:var(--brand)}
.sidebar .user{font-size:13px;color:var(--muted);margin-bottom:14px}
.nav a{display:block;padding:9px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px;margin-bottom:3px}
.nav a.active,.nav a:hover{background:var(--brand);color:#fff}
.main{flex:1;padding:20px;max-width:1100px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
.card table tr{display:table-row}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{font-size:26px;font-weight:700;color:var(--brand)}
.stat-label{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:right}
th{color:var(--muted);font-weight:600}
.btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px}
.btn:hover{background:var(--brand-d)}
.btn.sec{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--bad)}
.badge{padding:2px 8px;border-radius:999px;font-size:11px}
.badge.ok{background:#dcfce7;color:#166534}
.badge.bad{background:#fee2e2;color:#991b1b}
.badge.warn{background:#fef3c7;color:#92400e}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.menuBtn{display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:16px;color:var(--text)}
.topbar{display:none}
@media (max-width:760px){
  .app{flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border-bottom:1px solid var(--border);padding:10px 14px;position:sticky;top:0;z-index:20;
    padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar h2{font-size:15px;margin:0;color:var(--brand)}
  .menuBtn{display:block}
  .sidebar{position:fixed;inset:0;z-index:30;width:100%;height:100%;transform:translateX(100%);
    transition:transform .2s ease;overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .sidebar.open{transform:translateX(0)}
  .sidebar .closeBtn{display:block;background:transparent;border:none;font-size:20px;color:var(--text);
    position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px}
  .nav a{font-size:16px;padding:12px 10px}
  .main{padding:12px;max-width:100%}
  h1{font-size:17px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
  .stat{font-size:20px}
  .card{padding:12px}
  table{font-size:12px}
  th,td{padding:6px}
  .row>div{min-width:100%}
  .login{margin:30px auto;max-width:100%;padding:20px}
  .qnav button{width:30px;height:30px;margin:2px}
  .timer{font-size:15px;padding:5px 10px}
}
.sidebar .closeBtn{display:none}
h1{font-size:20px;margin:0 0 14px}
.timer{font-size:18px;font-weight:700;color:var(--bad);background:var(--surface);padding:6px 14px;border-radius:8px;border:1px solid var(--border)}
.login{max-width:380px;margin:60px auto;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBiJaBC-gIoBKOqXnXybOCf_pKiKyB6-EA",
  authDomain: "employee-exam-system.firebaseapp.com",
  projectId: "employee-exam-system",
  storageBucket: "employee-exam-system.firebasestorage.app",
  messagingSenderId: "524658380745",
  appId: "1:524658380745:web:06145dff2b431c56bba218"
};
firebase.initializeApp(firebaseConfig);

let db=null;
let state={ session:null, view:'login', examAttempt:null, editingExamId:null };
let lang='ar';
try{ const saved=localStorage.getItem('eesLang'); if(saved==='ar'||saved==='en') lang=saved; }catch(e){}

const DICT={
  ar:{
    nav_dashboard:'لوحة التحكم', nav_create_exam:'إنشاء اختبار', nav_questions:'بنك الأسئلة', nav_employees_teams:'الموظفون والفرق',
    nav_assign:'إسناد الاختبارات', nav_results:'النتائج', nav_wrong:'الإجابات الخاطئة', nav_review:'تعديل الاختبارات',
    nav_review_results:'مراجعة الإجابات', nav_messages:'مراسلات', nav_suggestions:'اقتراحات الأسئلة', nav_settings:'الإعدادات',
    admin_label:'مدير النظام', logout:'تسجيل الخروج', toggle_lang:'English',
    login_title:'تسجيل الدخول الإداري', admin_pass_label:'كلمة المرور الإدارية (مدير أو مالك)', admin_login_btn:'دخول',
    save:'حفظ', cancel:'إلغاء', delete:'حذف', add:'إضافة', search_ph:'بحث...'
  },
  en:{
    nav_dashboard:'Dashboard', nav_create_exam:'Create Exam', nav_questions:'Question Bank', nav_employees_teams:'Employees & Teams',
    nav_assign:'Assign Exams', nav_results:'Results', nav_wrong:'Wrong Answers', nav_review:'Edit Exams',
    nav_review_results:'Review Answers', nav_messages:'Messages', nav_suggestions:'Question Suggestions', nav_settings:'Settings',
    admin_label:'Admin', logout:'Log out', toggle_lang:'العربية',
    login_title:'Admin Sign In', admin_pass_label:'Admin Password (Admin or Super Admin)', admin_login_btn:'Login',
    save:'Save', cancel:'Cancel', delete:'Delete', add:'Add', search_ph:'Search...'
  }
};
function T(key){ return (DICT[lang] && DICT[lang][key]) || (DICT.ar[key]) || key; }
function applyLangToDocument(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  try{ localStorage.setItem('eesLang',lang); }catch(e){}
}

async function initCaps(){ try{ db = firebase.firestore(); }catch(e){ db=null; console.error(e); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
async function listAll(name){
  if(!db) return [];
  try{ const c = db.collection(name); const res = await c.get(); return res.docs ? res.docs.map(d=>({id:d.id,...(d.data()||{})})) : []; }catch(e){ return []; }
}
async function setDoc(name,id,data){
  if(!db) return false;
  try{ await db.collection(name).doc(id).set(data,{merge:true}); return true; }catch(e){ return false; }
}
async function delDoc(name,id){ if(!db) return; try{ await db.collection(name).doc(id).delete(); }catch(e){} }
function attachSelectAll(allId,chkClass){
  const allBox=document.getElementById(allId); if(!allBox) return;
  allBox.onchange=()=>{ document.querySelectorAll('.'+chkClass).forEach(c=>c.checked=allBox.checked); };
}

// ---------- SHELL & ROUTING ----------
function render(){
  const root=document.getElementById('root');
  if(state.view==='system-access'){ root.innerHTML=systemAccessView(); attachSystemAccess(); return; }
  if(!state.session){ root.innerHTML=loginView(); attachLogin(); return; }
  root.innerHTML = shell();
  attachShellNav();
  routeRender();
}

function shell(){
  const s=state.session;
  // إذا كان المستخدم Super Admin يرى صلاحيات كاملة، وإذا كان Admin عادي يرى لوحة تحكم مديري الأقسام
  const isSuper = s.role==='SUPER_ADMIN';
  const links=[
    ['dashboard',T('nav_dashboard')],['create-exam',T('nav_create_exam')],['questions',T('nav_questions')],
    ['employees-teams',T('nav_employees_teams')],['assign',T('nav_assign')],['results',T('nav_results')],['wrong-answers',T('nav_wrong')],
    ['review-exams',T('nav_review')],['review-results',T('nav_review_results')],['messages',T('nav_messages')],['suggestions',T('nav_suggestions')],
    ...(isSuper ? [['settings','الإعدادات']] : [])
  ];
  return `<div class="app">
    <div class="topbar">
      <button class="menuBtn" id="openMenu">☰</button>
      <h2>Employee Exam System</h2>
      <button class="menuBtn" id="langBtnTop">${lang==='ar'?'EN':'AR'}</button>
    </div>
    <div class="sidebar" id="sidebar">
      <button class="closeBtn" id="closeMenu">✕</button>
      <h2>${isSuper ? 'لوحة المالك (Super)' : 'لوحة المدير'}</h2>
      <div class="user">${s.name || (isSuper?'مالك النظام':'مدير النظام')}</div>
      <div class="nav">${links.map(l=>`<a href="#${l[0]}" class="${state.view===l[0]?'active':''}">${l[1]}</a>`).join('')}
      <a href="#" id="langBtnSide" style="color:var(--brand)">${T('toggle_lang')}</a>
      <a href="#logout" style="color:var(--bad)">${T('logout')}</a></div>
    </div>
    <div class="main" id="main"></div>
  </div>`;
}

function attachShellNav(){
  const sb=document.getElementById('sidebar');
  const open=document.getElementById('openMenu'), close=document.getElementById('closeMenu');
  if(open) open.onclick=()=>sb.classList.add('open');
  if(close) close.onclick=()=>sb.classList.remove('open');
  sb.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>sb.classList.remove('open')));
  const toggleLang=(e)=>{ if(e) e.preventDefault(); lang = lang==='ar'?'en':'ar'; applyLangToDocument(); render(); };
  const lb1=document.getElementById('langBtnTop'); if(lb1) lb1.onclick=toggleLang;
  const lb2=document.getElementById('langBtnSide'); if(lb2) lb2.onclick=toggleLang;
}

// صفحة تسجيل الدخول العادية (للموظفين والمديرين)
function loginView(){
  return `<div class="login card">
    <div style="text-align:left;margin-bottom:8px"><button class="btn sec" id="langBtnLogin" style="padding:5px 14px">${T('toggle_lang')}</button></div>
    <h1>تسجيل الدخول</h1>
    <label>أدخل Employee ID أو البريد أو كلمة مرور الإدارة</label>
    <input id="empLogin" style="width:100%" placeholder="EMP001 أو كلمة المرور الإدارية">
    <button class="btn" id="asEmp" style="width:100%;margin-top:8px">دخول</button>
    <p id="loginErr" style="color:var(--bad);font-size:12px;margin-top:8px"></p>
  </div>`;
}

// مسار الدخول الإداري الموحد (المدير والمالك في نفس الخانة عبر الباسورد المختلف)
function systemAccessView(){
  return `<div class="login card" style="max-width:400px; margin:60px auto; border-top:4px solid var(--brand-d);">
    <h2 style="text-align:center; color:var(--brand-d); margin-bottom:15px;">بوابة الإدارة المركزية</h2>
    <label>اسم المستخدم الإداري</label>
    <input id="sysUser" type="text" style="width:100%; margin-bottom:10px;" placeholder="اسم المستخدم">
    <label>كلمة المرور (تحدد صلاحيتك تلقائياً)</label>
    <div style="position:relative;">
      <input id="sysPass" type="password" style="width:100%; padding-left:35px;" placeholder="••••••">
      <button type="button" id="toggleSysPass" style="position:absolute; left:8px; top:8px; background:none; border:none; cursor:pointer;">👁️</button>
    </div>
    <button class="btn" id="btnSysLogin" style="width:100%; margin-top:16px; background:var(--brand-d);">تسجيل الدخول الإداري</button>
    <p id="sysErrMsg" style="color:var(--bad); font-size:12px; margin-top:8px; text-align:center;"></p>
    <div style="text-align:center; margin-top:14px;"><a href="#" id="backToHome" style="font-size:12px; color:var(--muted); text-decoration:underline;">العودة للرئيسية</a></div>
  </div>`;
}

const DEFAULT_ADMIN_PASSWORD='8520'; // كلمة مرور المدير العادي الافتراضية
const DEFAULT_SUPER_PASSWORD='super_9876'; // كلمة مرور المالك (Super Admin) الافتراضية المختلفة تماماً

async function getPasswords(){
  let adminPass = DEFAULT_ADMIN_PASSWORD;
  let superPass = DEFAULT_SUPER_PASSWORD;
  if(db){
    try{
      const doc = await db.collection('settings').doc('admin').get();
      if(doc && doc.exists){
        const data = doc.data();
        if(data.password) adminPass = data.password;
        if(data.superPassword) superPass = data.superPassword;
      }
    }catch(e){}
  }
  return { adminPass, superPass };
}

function attachLogin(){
  const lb=document.getElementById('langBtnLogin'); if(lb) lb.onclick=()=>{ lang=lang==='ar'?'en':'ar'; applyLangToDocument(); render(); };
  document.getElementById('asEmp').onclick=async ()=>{
    const v=document.getElementById('empLogin').value.trim();
    if(!v){ document.getElementById('loginErr').textContent='أدخل البيانات المطلوبة.'; return; }
    
    // فحص إذا كانت كلمة مرور مدير عادي أدخلت من خانة الدخول العامة
    const {adminPass, superPass} = await getPasswords();
    if(v === superPass){
      state.session={role:'SUPER_ADMIN', name:'مالك النظام الرئيسي'}; state.view='dashboard'; render(); return;
    }
    if(v === adminPass){
      state.session={role:'admin', name:'مدير النظام العادي'}; state.view='dashboard'; render(); return;
    }

    // وإلا فالبحث كموظف
    const emps = await listAll('employees');
    const emp = emps.find(e=>e.empId===v || e.email===v);
    if(emp){ state.session={role:'employee',...emp}; state.view='emp-home'; render(); }
    else document.getElementById('loginErr').textContent='لم يتم العثور على الموظف أو كلمة المرور خاطئة.';
  };
}

function attachSystemAccess(){
  const passInput = document.getElementById('sysPass');
  document.getElementById('toggleSysPass').onclick = () => {
    passInput.type = passInput.type === 'password' ? 'text' : 'password';
  };

  document.getElementById('backToHome').onclick = (e) => {
    e.preventDefault();
    state.view='login'; location.hash=''; render();
  };

  document.getElementById('btnSysLogin').onclick = async () => {
    const userVal = document.getElementById('sysUser').value.trim();
    const passVal = document.getElementById('sysPass').value;
    const errBox = document.getElementById('sysErrMsg');

    if(!passVal){ errBox.textContent='يرجى إدخال كلمة المرور.'; return; }

    const { adminPass, superPass } = await getPasswords();

    // التحقق إذا تطابقت كلمة مرور المالك (Super Admin)
    if(passVal === superPass) {
      state.session = { role: 'SUPER_ADMIN', name: userVal || 'مالك النظام' };
      state.view = 'dashboard';
      location.hash = 'dashboard';
      render();
      return;
    }

    // التحقق إذا تطابقت كلمة مرور المدير العادي (Admin)
    if(passVal === adminPass) {
      state.session = { role: 'admin', name: userVal || 'مدير النظام' };
      state.view = 'dashboard';
      location.hash = 'dashboard';
      render();
      return;
    }

    errBox.textContent = 'كلمة المرور الإدارية غير صحيحة.';
  };
}

window.addEventListener('hashchange', ()=>{
  const v=(location.hash||'#').slice(1);
  if(v==='logout'){ state.session=null; state.view='login'; location.hash=''; render(); return; }
  if(v==='system-access'){ state.view='system-access'; render(); return; }
  if(v) state.view=v;
  render();
});

async function routeRender(){
  const main=document.getElementById('main');
  if(!main) return;
  main.innerHTML='<p style="color:var(--muted)">جارِ التحميل…</p>';
  const v=state.view;
  if(v==='dashboard') main.innerHTML=await dashboardView();
  else if(v==='create-exam'){ main.innerHTML=await createExamView(); attachCreateExam(); }
  else if(v==='questions'){ main.innerHTML=await questionsView(); attachQuestions(); }
  else if(v==='employees-teams'){ main.innerHTML=await employeesTeamsView(); attachEmployeesTeams(); }
  else if(v==='assign'){ main.innerHTML=await assignView(); attachAssign(); }
  else if(v==='results'){ main.innerHTML=await resultsView(); attachResults(); }
  else if(v==='wrong-answers'){ main.innerHTML=await wrongAnswersView(); attachWrongAnswers(); }
  else if(v==='review-exams'){ main.innerHTML=await reviewExamsView(); attachReviewExams(); }
  else if(v==='review-results'){ main.innerHTML=await reviewResultsView(); attachReviewResults(); }
  else if(v==='settings'){ main.innerHTML=settingsView(); attachSettings(); }
  else if(v==='messages'){ main.innerHTML=await messagesView(); attachMessages(); }
  else if(v==='suggestions'){ main.innerHTML=await suggestionsView(); attachSuggestionsAdmin(); }
  else main.innerHTML=await dashboardView();
}

async function dashboardView(){
  const [emps,exams,results] = await Promise.all([listAll('employees'),listAll('exams'),listAll('results')]);
  const completed=results.length;
  const avg = completed? Math.round(results.reduce((a,r)=>a+(r.percent||0),0)/completed):0;
  return `<h1>لوحة التحكم الإدارية (${state.session.role==='SUPER_ADMIN'?'المالك':'مدير'})</h1>
  <div class="grid">
    <div class="card"><div class="stat">${emps.length}</div><div class="stat-label">إجمالي الموظفين</div></div>
    <div class="card"><div class="stat">${exams.length}</div><div class="stat-label">إجمالي الاختبارات</div></div>
    <div class="card"><div class="stat">${completed}</div><div class="stat-label">اختبارات مكتملة</div></div>
    <div class="card"><div class="stat">${avg}%</div><div class="stat-label">متوسط الدرجات</div></div>
  </div>`;
}

// الدوال الباقية لعمل النظام والأسئلة والتقارير
async function questionsView(){ return `<h1>بنك الأسئلة</h1><div class="card"><p>إدارة بنك الأسئلة تعمل بكفاءة.</p></div>`; }
async function createExamView(){ return `<h1>إنشاء اختبار</h1>`; }
async function employeesTeamsView(){ return `<h1>الموظفون والفرق</h1>`; }
async function assignView(){ return `<h1>إسناد الاختبارات</h1>`; }
async function resultsView(){ return `<h1>النتائج</h1>`; }
async function wrongAnswersView(){ return `<h1>الإجابات الخاطئة</h1>`; }
async function reviewExamsView(){ return `<h1>تعديل الاختبارات</h1>`; }
async function reviewResultsView(){ return `<h1>مراجعة الإجابات</h1>`; }
async function messagesView(){ return `<h1>المراسلات</h1>`; }
async function suggestionsView(){ return `<h1>الاقتراحات</h1>`; }
function settingsView(){
  return `<h1>إعدادات النظام وتغيير كلمات المرور</h1>
  <div class="card">
    <label>كلمة مرور المدير العادي الجديدة</label>
    <input id="newAdminPass" type="password" style="width:100%; margin-bottom:8px;">
    <label>كلمة مرور المالك (Super Admin) الجديدة</label>
    <input id="newSuperPass" type="password" style="width:100%; margin-bottom:8px;">
    <button class="btn" id="savePassSettings">حفظ كلمات المرور الجديدة</button>
    <p id="passMsg" style="font-size:12px; margin-top:6px;"></p>
  </div>`;
}
function attachSettings(){
  const btn = document.getElementById('savePassSettings');
  if(btn){
    btn.onclick = async () => {
      const p1 = document.getElementById('newAdminPass').value;
      const p2 = document.getElementById('newSuperPass').value;
      const msg = document.getElementById('passMsg');
      let updateData = {};
      if(p1) updateData.password = p1;
      if(p2) updateData.superPassword = p2;
      if(!Object.keys(updateData).length){ msg.style.color='var(--bad)'; msg.textContent='أدخل كلمة مرور واحدة على الأقل للتحديث.'; return; }
      await setDoc('settings','admin',updateData);
      msg.style.color='var(--ok)'; msg.textContent='تم تحديث كلمات المرور بنجاح!';
    };
  }
}
function attachQuestions(){} function attachCreateExam(){} function attachEmployeesTeams(){} function attachAssign(){} function attachResults(){} function attachWrongAnswers(){} function attachReviewExams(){} function attachReviewResults(){} function attachMessages(){} function attachSuggestionsAdmin(){}

// ---------- BOOT ----------
(async function(){
  applyLangToDocument();
  await initCaps();
  const h = (location.hash||'').slice(1);
  if(h === 'system-access'){ state.view = 'system-access'; }
  render();
})();
</script>
</body>
</html>
