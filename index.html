<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Employee Exam System</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
  --brand:#2563eb; --brand-d:#1d4ed8; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1420; --surface:#171d2b; --text:#e5e7eb; --muted:#9aa4b2; --border:#2a3242; }
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--surface);border-left:1px solid var(--border);padding:16px;flex-shrink:0}
.sidebar h2{font-size:16px;color:var(--brand)}
.sidebar .user{font-size:13px;color:var(--muted);margin-bottom:14px}
.nav a{display:block;padding:9px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px;margin-bottom:3px}
.nav a.active,.nav a:hover{background:var(--brand);color:#fff}
.main{flex:1;padding:20px;max-width:1100px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
.card table tr{display:table-row}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{font-size:26px;font-weight:700;color:var(--brand)}
.stat-label{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:right}
th{color:var(--muted);font-weight:600}
.btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px}
.btn:hover{background:var(--brand-d)}
.btn.sec{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--bad)}
.badge{padding:2px 8px;border-radius:999px;font-size:11px}
.badge.ok{background:#dcfce7;color:#166534}
.badge.bad{background:#fee2e2;color:#991b1b}
.badge.warn{background:#fef3c7;color:#92400e}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.menuBtn{display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:16px;color:var(--text)}
.topbar{display:none}
@media (max-width:760px){
  .app{flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border-bottom:1px solid var(--border);padding:10px 14px;position:sticky;top:0;z-index:20;
    padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar h2{font-size:15px;margin:0;color:var(--brand)}
  .menuBtn{display:block}
  .sidebar{position:fixed;inset:0;z-index:30;width:100%;height:100%;transform:translateX(100%);
    transition:transform .2s ease;overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .sidebar.open{transform:translateX(0)}
  .sidebar .closeBtn{display:block;background:transparent;border:none;font-size:20px;color:var(--text);
    position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px}
  .nav a{font-size:16px;padding:12px 10px}
  .main{padding:12px;max-width:100%}
  h1{font-size:17px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
  .stat{font-size:20px}
  .card{padding:12px}
  table{font-size:12px}
  th,td{padding:6px}
  .row>div{min-width:100%}
  .login{margin:30px auto;max-width:100%;padding:20px}
  .qnav button{width:30px;height:30px;margin:2px}
  .timer{font-size:15px;padding:5px 10px}
}
.sidebar .closeBtn{display:none}
h1{font-size:20px;margin:0 0 14px}
.qopt{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.timer{font-size:18px;font-weight:700;color:var(--bad);background:var(--surface);padding:6px 14px;border-radius:8px;border:1px solid var(--border)}
.login{max-width:380px;margin:60px auto;text-align:center}
.qnav button{width:34px;height:34px;border-radius:6px;border:1px solid var(--border);background:var(--surface);margin:2px;color:var(--text)}
.qnav button.answered{background:#dbeafe}
.qnav button.current{outline:2px solid var(--brand)}

/* ===== New login (ID only) ===== */
.lg-wrap{min-height:100vh;display:grid;place-items:center;padding:32px 18px;position:relative;overflow:hidden;
  font-family:"Cairo","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  background:radial-gradient(1000px 560px at 85% -10%,rgba(79,134,247,.55),transparent 60%),
    radial-gradient(800px 560px at 0% 110%,rgba(245,179,1,.22),transparent 55%),
    linear-gradient(155deg,#071433 0%,#0b1f4d 45%,#123a9c 100%);}
.lg-wrap::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(circle at 50% 45%,#000 25%,transparent 75%);mask-image:radial-gradient(circle at 50% 45%,#000 25%,transparent 75%)}
.lg-wrap svg.lg-i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lg-card{position:relative;width:100%;max-width:470px;background:rgba(255,255,255,.94);color:#0f1b3d;border:1px solid rgba(255,255,255,.9);border-radius:24px;
  box-shadow:0 30px 80px -20px rgba(7,20,51,.6),0 8px 24px -8px rgba(7,20,51,.35);padding:34px 34px 26px;animation:lgRise .9s both cubic-bezier(.2,.8,.2,1)}
@keyframes lgRise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.lg-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:20px}
.lg-logo{width:74px;height:74px;filter:drop-shadow(0 10px 18px rgba(29,78,216,.35));animation:lgPop .8s .2s both cubic-bezier(.3,1.5,.5,1)}
@keyframes lgPop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
.lg-brand h1{font-size:23px;font-weight:800;color:#0b1f4d;margin:6px 0 0}
.lg-en{font-size:11.5px;letter-spacing:1.6px;color:#5b6785;font-weight:600;direction:ltr}
.lg-tagline{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;color:#1d4ed8}
.lg-tagline i{width:5px;height:5px;border-radius:50%;background:#f5b301}
.lg-sep{height:1px;background:linear-gradient(90deg,transparent,#e3e8f4,transparent);margin:4px 0 18px}
.lg-welcome h2{font-size:22px;font-weight:800;color:#0b1f4d;margin:0}
.lg-welcome p{color:#5b6785;font-size:14px;margin:2px 0 16px}
.lg-lbl{display:block;font-size:13px;font-weight:700;color:#10296a;margin:0 0 7px}
.lg-field{position:relative;display:flex;align-items:center;border:1.6px solid #e3e8f4;background:#fff;border-radius:14px;transition:border-color .2s,box-shadow .2s}
.lg-field:focus-within{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.16)}
.lg-field.err{border-color:#c62828;box-shadow:0 0 0 4px rgba(198,40,40,.12)}
.lg-field .lg-i{position:absolute;right:15px;font-size:19px;color:#7d8bb0;pointer-events:none}
.lg-field:focus-within .lg-i{color:#2563eb}
.lg-field input{width:100%;border:0;outline:0;background:transparent;color:#0f1b3d;border-radius:14px;padding:15px 46px 15px 14px;font-size:15.5px;font-weight:600;font-family:inherit}
.lg-field input::placeholder{color:#9aa6c4;font-weight:400}
.lg-error{display:none;align-items:flex-start;gap:9px;margin-top:12px;padding:11px 13px;border-radius:12px;background:#fdecec;color:#c62828;font-size:13px;font-weight:600;line-height:1.7;border:1px solid rgba(198,40,40,.22)}
.lg-error.show{display:flex;animation:lgShake .45s}
.lg-error .lg-i{font-size:18px;margin-top:2px}
@keyframes lgShake{20%{transform:translateX(7px)}40%{transform:translateX(-7px)}60%{transform:translateX(5px)}80%{transform:translateX(-4px)}}
.lg-btn{width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;color:#fff;font-weight:800;font-size:16px;font-family:inherit;
  padding:15px 18px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#1d4ed8 55%,#10296a);box-shadow:0 14px 28px -10px rgba(29,78,216,.7);
  transition:transform .2s,box-shadow .2s,filter .2s,opacity .2s;position:relative;overflow:hidden}
.lg-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.lg-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 20px 34px -12px rgba(29,78,216,.8);filter:brightness(1.06)}
.lg-btn:hover:not(:disabled)::after{transform:translateX(120%)}
.lg-btn:focus-visible{outline:3px solid #ffc933;outline-offset:3px}
.lg-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.lg-btn .lg-i{font-size:19px}
.lg-btn.success{background:linear-gradient(135deg,#1aa150,#12803c)}
.lg-spin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:lgSpin .8s linear infinite;display:none}
.lg-btn.loading .lg-spin{display:block}
.lg-btn.loading .lg-arrow{display:none}
@keyframes lgSpin{to{transform:rotate(360deg)}}
.lg-who{margin-top:24px}
.lg-who-title{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:800;color:#0b1f4d;margin-bottom:12px}
.lg-who-title::before,.lg-who-title::after{content:"";flex:1;height:1px;background:#e3e8f4}
.lg-who-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lg-who-card{text-align:center;padding:13px 8px 12px;border-radius:14px;background:#fff;border:1px solid #e3e8f4;transition:transform .25s,box-shadow .25s,border-color .25s}
.lg-who-card:hover{transform:translateY(-4px);border-color:#4f86f7;box-shadow:0 14px 26px -14px rgba(29,78,216,.5)}
.lg-who-card .lg-ic{width:38px;height:38px;margin:0 auto 8px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:#fff}
.lg-who-card:nth-child(1) .lg-ic{background:linear-gradient(135deg,#ffc933,#e09b00);color:#071433}
.lg-who-card:nth-child(2) .lg-ic{background:linear-gradient(135deg,#2563eb,#10296a)}
.lg-who-card:nth-child(3) .lg-ic{background:linear-gradient(135deg,#2bb673,#17803d)}
.lg-who-card h4{font-size:12.5px;font-weight:800;color:#0b1f4d;margin:0}
.lg-who-card p{font-size:11px;line-height:1.6;color:#5b6785;margin:3px 0 0}
.lg-secure{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #e3e8f4;font-size:12.5px;font-weight:600;color:#5b6785}
.lg-secure .lg-i{color:#17803d;font-size:17px}
@media (max-width:640px){
  .lg-card{padding:26px 20px 22px}
  .lg-who-grid{grid-template-columns:1fr}
  .lg-who-card{display:flex;align-items:center;gap:12px;text-align:right;padding:11px 12px}
  .lg-who-card .lg-ic{margin:0}
}
@media (prefers-reduced-motion:reduce){.lg-wrap *{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== Premium dark theme ===== */
:root{--bg:#0B1120;--surface:#172235;--text:#F8FAFC;--muted:#94A3B8;--border:#34445D;--brand:#F5B342;--brand-d:#e0a030;--ok:#22C55E;--bad:#EF4444;--warn:#F5B342;color-scheme:dark}
body{background:var(--bg)}
.sidebar{background:#111827}
.card,.kc{border-color:var(--border);box-shadow:0 0 0 1px rgba(245,179,66,.07),0 10px 28px -14px rgba(245,179,66,.25)}
.btn{color:#0B1120;font-weight:700}.btn.danger{color:#fff}.btn.sec{color:var(--brand)}
.nav a.active,.nav a:hover{background:var(--brand);color:#0B1120}
.badge.ok{background:rgba(34,197,94,.15);color:#4ade80}.badge.bad{background:rgba(239,68,68,.15);color:#f87171}.badge.warn{background:rgba(245,179,66,.15);color:#F5B342}
.qnav button.answered{background:#1e3a5f}
@media (min-width:761px){.app{flex-direction:row-reverse}.sidebar{border-left:none;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto}}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kc{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kc .v{font-size:26px;font-weight:800;color:var(--brand)}.kc .l{font-size:12px;color:var(--muted)}.kc .ic{font-size:20px}
.dl{font-size:11px;font-weight:700;color:var(--muted)}.dl.up{color:#22C55E}.dl.dn{color:#EF4444}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.bar{height:8px;border-radius:99px;background:#0B1120;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,#F5B342,#fb923c)}
.pill{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px}.pill.on{background:var(--brand);color:#0B1120;border-color:var(--brand)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.fnote{font-size:11px;color:var(--muted);margin-top:8px}
.qr{cursor:pointer;transition:transform .2s,border-color .2s}.qr:hover{transform:translateY(-3px);border-color:var(--brand)}
.pgr{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;font-size:12px}
.prn{display:none}
@media (max-width:900px){.kg{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media print{.sidebar,.topbar,.no-print{display:none!important}body{background:#fff;color:#000}.app{display:block}.main{max-width:100%;padding:0}
.card,.kc{background:#fff!important;color:#000;box-shadow:none;border:1px solid #bbb}.kc .v,.card h3{color:#000}.card table{display:table;white-space:normal}th,td{color:#000}.prn{display:block}
@page{margin:14mm;@bottom-center{content:"Employee Exam System — صفحة " counter(page)}}}

/* ===== Reference look ===== */
body{background:radial-gradient(1100px 600px at 80% -10%,rgba(37,99,235,.25),transparent 60%),radial-gradient(900px 600px at 0% 100%,rgba(139,92,246,.14),transparent 60%),#070d24}
.card,.panel{background:linear-gradient(160deg,#101b3c,#0b1330);border:1px solid #223463;border-radius:18px;box-shadow:0 0 24px -10px rgba(59,130,246,.45)}
.sidebar{background:linear-gradient(180deg,#0c1533,#0a1028);border-right:1px solid #1d2b4a;display:flex;flex-direction:column}
.sidebar .nav{display:flex;flex-direction:column;gap:2px}
.nav a{padding:11px 12px;border-radius:12px;color:#c7d2ee}
.nav a.active{background:linear-gradient(90deg,#1d6ff2,#2b8cff);color:#fff;box-shadow:0 0 18px rgba(43,140,255,.55)}
.nav a:hover:not(.active){background:rgba(255,255,255,.06);color:#fff}
.owner{margin-top:auto;border:1.5px solid #b8860b;border-radius:14px;padding:12px;text-align:center;background:linear-gradient(160deg,rgba(245,179,66,.18),rgba(245,179,66,.04));box-shadow:0 0 18px -6px #f5b342;color:#F5B342}
.owner b{display:block;font-size:14px}.owner small{color:#d9b25e}
.sb-logo{display:flex;justify-content:center;margin:2px 0 10px}
.mainWrap{flex:1;min-width:0}.mainWrap .main{max-width:1500px}
.hdr{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid #1d2b4a;background:rgba(9,16,40,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:15}
.hdr-t b{display:block;font-size:19px;font-weight:800}.hdr-t small{color:var(--muted);font-size:12px}
.srch{position:relative;flex:1;max-width:520px;margin:0 auto}
.srch input{width:100%;border-radius:99px;padding:10px 18px;background:#0e1a3d;border:1px solid #223463}
.sres{display:none;position:absolute;top:44px;right:0;left:0;background:#0e1a3d;border:1px solid #223463;border-radius:14px;padding:6px;z-index:30;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.sres a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13px}.sres a:hover{background:#1b2c5c}.sres .sh{color:var(--muted);font-size:11px;padding:6px 10px 2px}
.bell{position:relative;background:#0e1a3d;border:1px solid #223463;border-radius:99px;width:42px;height:42px;font-size:18px;color:#fff}
.bb{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center}
.usr{display:flex;align-items:center;gap:10px}.usr b{display:block;font-size:13px}.usr small{color:var(--muted);font-size:11px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#2563eb,#8b5cf6);color:#fff}
.kg4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kb{position:relative;border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px;border:1.5px solid var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,#0c1531),#0c1531 75%);box-shadow:0 0 22px -6px var(--c)}
.kb .ci{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:color-mix(in srgb,var(--c) 30%,transparent);flex-shrink:0}
.kb .n{font-size:30px;font-weight:800;line-height:1.1}.kb .t{font-size:13px;color:#cbd5e1}.kb .sp2{margin-right:auto}
.gr{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;margin-bottom:14px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ph h3{margin:0;font-size:16px}
.lg{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:5px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:8px}
.tp{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}.tp:first-child{background:rgba(255,255,255,.05)}.tp .rk{width:26px;text-align:center;font-weight:800;color:var(--muted)}
.tp .nm{flex:1;font-size:13px;line-height:1.3}.tp .nm small{color:var(--muted);display:block;font-size:11px}
.sp{padding:3px 12px;border-radius:99px;font-weight:700;font-size:13px;background:#1d4ed8;color:#fff}.sp.g{background:#15803d}
.ir{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:8px;font-size:13px}.ir small{display:block;color:var(--muted)}
.ir .ii{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.07)}.ir .ip{margin-right:auto;padding:3px 12px;border-radius:99px;font-weight:700;color:#fff}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qb{border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 18%,#0b1330);color:#fff;font-family:inherit;font-weight:700;font-size:13px}.qb small{display:block;color:#94a3b8;font-weight:400;font-size:11px}.qb:hover{box-shadow:0 0 16px -4px var(--c)}
.dsel{background:#0e1a3d;border:1px solid #223463;border-radius:12px;padding:8px 12px}
@media (max-width:1200px){.gr{grid-template-columns:1fr 1fr}.kg4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:800px){.gr,.kg4{grid-template-columns:1fr}.hdr-t,.usr div{display:none}.hdr{padding:10px 12px}}

/* KPI cards fit */
.kg4{gap:14px}
.kb{min-height:118px;padding:14px 16px;gap:12px;overflow:hidden}
.kb .ci{width:48px;height:48px;font-size:23px}
.kb .tx{flex:1 1 0;min-width:0}

function T(key){ return (DICT[lang] && DICT[lang][key]) || (DICT.ar[key]) || key; }
function applyLangToDocument(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  try{ localStorage.setItem('eesLang',lang); }catch(e){}
}

async function initCaps(){
  try{ db = firebase.firestore(); }catch(e){ db=null; console.error(e); }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function col(name){ return db ? db.collection(name) : null; }

async function listAll(name){
  if(!db) return [];
  try{
    const c = db.collection(name);
    const res = await c.get();
    return res.docs ? res.docs.map(d=>({id:d.id,...(d.data()||{})})) : [];
  }catch(e){ console.error(e); return []; }
}
async function setDoc(name,id,data){
  if(!db){ alert('تعذر الاتصال بقاعدة البيانات. أعد تحميل الصفحة وحاول مرة أخرى.'); return false; }
  try{ await db.collection(name).doc(id).set(data,{merge:true}); return true; }
  catch(e){ console.error(e); alert('حدث خطأ أثناء الحفظ: '+(e&&e.message?e.message:'غير معروف')); return false; }
}
// update() understands dotted paths (nested fields); set(...,{merge:true}) does NOT
async function updDoc(name,id,data){
  if(!db){ alert('تعذر الاتصال بقاعدة البيانات.'); return false; }
  try{ await db.collection(name).doc(id).update(data); return true; }
  catch(e){ console.error(e); alert('حدث خطأ أثناء الحفظ: '+(e&&e.message?e.message:'غير معروف')); return false; }
}
// read helpers that also honour legacy literal "seenBy.<id>" / "deletedBy.<id>" fields
function seenAtOf(m,id){ return (m.seenBy&&m.seenBy[id]) || m['seenBy.'+id] || null; }
function deletedByOf(m,id){ return !!((m.deletedBy&&m.deletedBy[id]) || m['deletedBy.'+id]); }
async function delDoc(name,id){ if(!db) return; try{ await db.collection(name).doc(id).delete(); }catch(e){console.error(e);} }
async function bulkDeleteSelected(collectionName,chkClass){
  const ids=[...document.querySelectorAll('.'+chkClass+':checked')].map(c=>c.value);
  if(!ids.length){ alert('اختر عنصرًا واحدًا على الأقل للحذف.'); return; }
  if(!confirm(`هل أنت متأكد من حذف ${ids.length} عنصر؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
  for(const id of ids) await delDoc(collectionName,id);
  routeRender();
}
function attachSelectAll(allId,chkClass){
  const allBox=document.getElementById(allId); if(!allBox) return;
  allBox.onchange=()=>{ document.querySelectorAll('.'+chkClass).forEach(c=>c.checked=allBox.checked); };
}

// ---------- notifications (sender gets notified when employee sees a message) ----------
let notifUnsub=null, notifKeyActive=null, notifList=[], notifUnread=0;
function notifKey(){ const s=state.session; return s&&s.role==='leader'? s.id : 'admin'; }
function showToast(msg){
  const t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90%;font-size:14px';
  document.body.appendChild(t); setTimeout(()=>t.remove(),5000);
}
function updateNavBadge(){
  const bb=document.getElementById('bellBadge'); if(bb){ bb.textContent=notifUnread||''; bb.style.display=notifUnread?'flex':'none'; }
  const a=document.querySelector('.nav a[href="#messages"]'); if(!a) return;
  const old=a.querySelector('#msgBadge'); if(old) old.remove();
  if(notifUnread>0){ const sp=document.createElement('span'); sp.id='msgBadge'; sp.className='badge bad'; sp.style.marginRight='6px'; sp.textContent=notifUnread; a.appendChild(sp); }
}
function renderNotifBox(){
  const box=document.getElementById('notifBox'); if(!box) return;
  const items=notifList.slice(0,10).map(n=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);${n.read?'color:var(--muted)':'font-weight:600'}">${n.read?'':'🔔 '}<strong>${n.employeeName||'-'}</strong> اطّلع على رسالتك «${n.subject||''}» <small>— ${n.createdAt?new Date(n.createdAt).toLocaleString('ar-EG'):''}</small> <button class="btn danger" data-delnotif="${n.id}" style="padding:2px 8px;font-size:11px;margin-right:6px">حذف</button></div>`).join('');
  box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3 style="margin:0">الإشعارات ${notifUnread?`<span class="badge bad">${notifUnread}</span>`:''}</h3>
    <div>${notifUnread?'<button class="btn sec" id="markAllNotif" style="padding:4px 10px">تحديد الكل كمقروء</button> ':''}${notifList.length?'<button class="btn danger" id="delAllNotif" style="padding:4px 10px">حذف الكل</button>':''}</div></div>
    ${items||'<p style="color:var(--muted);margin:8px 0 0">لا توجد إشعارات.</p>'}`;
  const mb=document.getElementById('markAllNotif');
  if(mb) mb.onclick=async()=>{ for(const n of notifList.filter(x=>!x.read)) await setDoc('notifications',n.id,{read:true}); };
  box.querySelectorAll('[data-delnotif]').forEach(b=>b.onclick=async()=>{ await delDoc('notifications',b.dataset.delnotif); });
  const da=document.getElementById('delAllNotif');
  if(da) da.onclick=async()=>{ if(!confirm('حذف كل الإشعارات؟')) return; for(const n of [...notifList]) await delDoc('notifications',n.id); };
}
function stopNotifListener(){ if(notifUnsub){ try{notifUnsub();}catch(e){} } notifUnsub=null; notifKeyActive=null; notifList=[]; notifUnread=0; }
function ensureNotifListener(){
  const s=state.session; if(!s||s.role==='employee'||!db) return;
  const key=notifKey(); if(notifUnsub && notifKeyActive===key) return;
  stopNotifListener(); notifKeyActive=key; let first=true;
  notifUnsub=db.collection('notifications').where('toId','==',key).onSnapshot(snap=>{
    notifList=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    notifUnread=notifList.filter(n=>!n.read).length;
    if(!first) snap.docChanges().forEach(ch=>{ if(ch.type==='added'){ const n=ch.doc.data(); if(!n.read) showToast('🔔 '+(n.employeeName||'')+' اطّلع على رسالتك: '+(n.subject||'')); } });
    first=false; updateNavBadge(); renderNotifBox();
  },err=>console.error(err));
}

function isLeaderSession(){ return !!(state.session && state.session.role==='leader'); }
function visibleLeaders(leaders){ return isLeaderSession()? leaders.filter(l=>l.id===state.session.id) : leaders; }
function ownExams(exams){ return isLeaderSession()? exams.filter(x=>x.createdBy===state.session.id) : exams; }
function filterResultsForLeader(results,emps,exams){
  if(!isLeaderSession()) return results;
  const me=state.session.id;
  return results.filter(r=>{
    const ex=exams.find(x=>x.id===r.examId); const em=emps.find(e=>e.id===r.employeeId);
    return (ex&&ex.createdBy===me) || (em&&em.teamLeaderId===me);
  });
}

function render(){
  const root=document.getElementById('root');
  if(!state.session){ root.innerHTML=loginView(); attachLogin(); return; }
  root.innerHTML = shell();
  attachShellNav();
  ensureNotifListener(); updateNavBadge();
  routeRender();
}

const NAVI={dashboard:'🏠',reports:'📄',questions:'❓','employees-teams':'👥',assign:'📌',results:'📊','wrong-answers':'❌','review-exams':'📝','review-results':'🔍',grading:'✍️',messages:'🔔',suggestions:'💡',settings:'⚙️','emp-home':'📝','emp-results':'📊','emp-profile':'👤','emp-messages':'🔔','suggest-question':'💡'};
let searchA=null, pendingExport=null;
function attachHeader(){
  searchA=null;
  const bell=document.getElementById('bellBtn'); if(bell) bell.onclick=()=>{state.view='messages'; routeRender();};
  updateNavBadge();
  const inp=document.getElementById('gSearch'), box=document.getElementById('sRes'); if(!inp) return;
  inp.onfocus=async()=>{ if(!searchA) searchA=await loadA(); };
  inp.oninput=async()=>{
    const q=inp.value.trim().toLowerCase(); if(!q){box.style.display='none';return;}
    if(!searchA) searchA=await loadA(); const A=searchA;
    const emps=A.emps.filter(e=>[e.name,e.empId,e.dept].join(' ').toLowerCase().includes(q)).slice(0,5);
    const exs=A.exams.filter(x=>(x.name||'').toLowerCase().includes(q)).slice(0,5);
    const ds=[...new Set(A.empAll.map(e=>e.dept).filter(Boolean))].filter(d=>d.toLowerCase().includes(q)).slice(0,5);
    const sec=(t,a,k,f)=>a.length?`<div class="sh">${t}</div>`+a.map(x=>`<a href="#" data-sk="${k}" data-sv="${esc(f(x)[1])}">${esc(f(x)[0])}</a>`).join(''):'';
    box.innerHTML=(sec('موظفون',emps,'emp',e=>[e.name+(e.dept?' — '+e.dept:''),e.id])+sec('اختبارات',exs,'exam',x=>[x.name,x.id])+sec('أقسام',ds,'dept',d=>[d,d]))||'<div class="sh">لا توجد نتائج</div>';
    box.style.display='block';
    box.querySelectorAll('[data-sk]').forEach(a=>a.onclick=ev=>{ev.preventDefault(); const k=a.dataset.sk; box.style.display='none'; inp.value='';
      if(k==='emp') state.view='employees-teams'; else if(k==='exam') state.view='review-exams'; else {rep.dept=a.dataset.sv; rep.tab='department'; state.view='reports';} routeRender();});
  };
  document.onclick=e=>{ if(box.isConnected && !e.target.closest('.srch')) box.style.display='none'; };
}
function shell(){
  const s=state.session;
  const adminLinks=[
    ['dashboard',T('nav_dashboard')],['reports','التقارير والتحليلات'],['questions',T('nav_questions')],
    ['employees-teams',T('nav_employees_teams')],['assign',T('nav_assign')],['results',T('nav_results')],['wrong-answers',T('nav_wrong')],

  ];
  const empLinks=[['emp-home',T('nav_my_exams')],['emp-results',T('nav_my_results')],['emp-profile',T('nav_my_profile')],['emp-messages',T('nav_messages')],['suggest-question',T('nav_suggest_question')]];
  const leaderLinks=adminLinks.filter(l=>l[0]!=='dashboard');
  const links = s.role==='admin'?adminLinks:(s.role==='leader'?leaderLinks:empLinks);
  return `<div class="app">
    <div class="topbar">
      <button class="menuBtn" id="openMenu">☰</button>
      <h2>Employee Exam System</h2>

      <div class="sb-logo"><svg width="64" height="52" viewBox="0 0 64 52"><path d="M32 4 4 18l28 14 28-14z" fill="#2b8cff"/><path d="M14 26v12c0 4 8 8 18 8s18-4 18-8V26l-18 9z" fill="#fff"/><path d="M58 20v18" stroke="#2b8cff" stroke-width="3"/></svg></div>
      <div class="user">${s.role==='admin'?T('admin_label'):(s.role==='leader'?'👑 '+s.name:s.name)}</div>
      <div class="nav">${links.map(l=>`<a href="#${l[0]}" class="${state.view===l[0]?'active':''}">${NAVI[l[0]]||'•'} ${l[1]}</a>`).join('')}
      <a href="#" id="langBtnSide" style="color:var(--brand)">${T('toggle_lang')}</a>
      <a href="#logout" style="color:var(--bad)">${T('logout')}</a></div>
      ${s.role==='admin'?'<div class="owner">👑<b>منطقة المالك</b><small>وصول كامل</small></div>':''}
    </div>
    <div class="mainWrap">
      <header class="hdr">
        <div class="hdr-t"><b>نظام اختبارات الموظفين</b><small>قيّم • حلّل • طوّر</small></div>
        ${s.role!=='employee'?'<div class="srch"><input id="gSearch" placeholder="ابحث عن موظف أو اختبار أو قسم..." autocomplete="off"><div id="sRes" class="sres"></div></div>':'<div style="flex:1"></div>'}
        ${s.role!=='employee'?'<button class="bell" id="bellBtn">🔔<span class="bb" id="bellBadge"></span></button>':''}
        <div class="usr"><span class="av">${esc((s.name||'م').trim().charAt(0))}</span><div><b>${esc(s.role==='admin'?T('admin_label'):s.name)}</b><small>${s.role==='admin'?'مالك النظام':(s.role==='leader'?'قائد فريق':'موظف')}</small></div></div>
      </header>
      <div class="main" id="main"></div>
    </div>
  </div>`;
}
function attachShellNav(){
  const sb=document.getElementById('sidebar');
  const open=document.getElementById('openMenu'), close=document.getElementById('closeMenu');
  if(open) open.onclick=()=>sb.classList.add('open');
  if(close) close.onclick=()=>sb.classList.remove('open');
  sb.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>sb.classList.remove('open')));
  const toggleLang=(e)=>{ if(e) e.preventDefault(); lang = lang==='ar'?'en':'ar'; applyLangToDocument(); render(); };
  const lb1=document.getElementById('langBtnTop'); if(lb1) lb1.onclick=toggleLang;
  const lb2=document.getElementById('langBtnSide'); if(lb2) lb2.onclick=toggleLang;
  attachHeader();
}

const DEFAULT_ADMIN_PASSWORD='8520';
async function getAdminPassword(){
  if(!db) return DEFAULT_ADMIN_PASSWORD;
  try{
    const doc = await db.collection('settings').doc('admin').get();
    if(!doc || !doc.exists) return DEFAULT_ADMIN_PASSWORD;
    const data = doc.data();
    return (data && data.password) ? data.password : DEFAULT_ADMIN_PASSWORD;
  }catch(e){ return DEFAULT_ADMIN_PASSWORD; }
}
// ID-only login: owner code -> team leader code -> employee (Employee ID or email)
async function authenticateId(id){
  if(!db) throw new Error('no-db');
  if(id===String(await getAdminPassword())) return {user:{role:'admin'},view:'dashboard'};
  const lead=await db.collection('teamLeaders').where('code','==',id).limit(1).get();
  if(!lead.empty){ const d=lead.docs[0]; return {user:{role:'leader',id:d.id,name:d.data().name},view:'grading'}; }
  let emp=await db.collection('employees').where('empId','==',id).limit(1).get();
  if(emp.empty) emp=await db.collection('employees').where('email','==',id).limit(1).get();
  if(!emp.empty){ const d=emp.docs[0]; return {user:{role:'employee',id:d.id,...d.data()},view:'emp-home'}; }
  return null;
}
function attachLogin(){
  const form=document.getElementById('lgForm'), input=document.getElementById('lgId'), field=document.getElementById('lgField');
  const btn=document.getElementById('lgBtn'), lbl=document.getElementById('lgBtnLbl');
  const errBox=document.getElementById('lgErr'), errTxt=document.getElementById('lgErrTxt');
  let busy=false;
  const sync=()=>{ btn.disabled = busy || input.value.trim()===''; };
  const showErr=(m)=>{ errTxt.textContent=m; errBox.classList.remove('show'); void errBox.offsetWidth; errBox.classList.add('show'); field.classList.add('err'); };
  const clearErr=()=>{ errBox.classList.remove('show'); field.classList.remove('err'); };
  const setLoading=(on)=>{ busy=on; btn.classList.toggle('loading',on); lbl.textContent=on?'جارٍ التحقق...':'دخول'; input.readOnly=on; sync(); };
  input.addEventListener('input',()=>{ clearErr(); sync(); });
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const id=input.value.trim();
    if(!id){ showErr('من فضلك أدخل الـ ID الخاص بك.'); return; }
    if(busy) return;
    clearErr(); setLoading(true);
    try{
      const res=await authenticateId(id);
      if(!res){ setLoading(false); showErr('الـ ID غير صحيح. تأكد من الرقم وحاول مرة أخرى.'); input.focus(); input.select(); return; }
      btn.classList.remove('loading'); btn.classList.add('success'); lbl.textContent='تم تسجيل الدخول ✓';
      setTimeout(()=>{ state.session=res.user; state.view=res.view; render(); },450);
    }catch(err){
      console.error(err); setLoading(false);
      showErr('تعذر الاتصال بالخادم. تحقق من اتصالك بالإنترنت وحاول مرة أخرى.');
    }
  });
  input.focus({preventScroll:true}); sync();
}

function bindPeriod(f,idp,again){
  document.querySelectorAll(`[data-${idp}]`).forEach(b=>b.onclick=()=>{f.p=b.dataset[idp]; again();});

}

      const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['ملخص التقرير'],...B.summary]),'Summary');
      tabs.forEach(k=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([B.R[k].head,...B.R[k].rows]),k)); XLSX.writeFile(wb,'exam-report.xlsx');
    }catch(e){ alert('تعذر تحميل مكتبة Excel. تحقق من الاتصال بالإنترنت أو استخدم CSV.'); }};

}

async function dashboardViewLegacy(){
  const [emps,exams,results] = await Promise.all([listAll('employees'),listAll('exams'),listAll('results')]);

  const avg = completed? Math.round(results.reduce((a,r)=>a+(r.percent||0),0)/completed):0;
  const passRate = completed? Math.round(results.filter(r=>r.passed).length/completed*100):0;
  const assignments = await listAll('assignments');
  const pending = assignments.filter(a=>!results.some(r=>r.examId===a.examId && r.employeeId===a.employeeId)).length;
  return `<h1>لوحة التحكم</h1>
  <div class="grid">
    <div class="card"><div class="stat">${emps.length}</div><div class="stat-label">إجمالي الموظفين</div></div>
    <div class="card"><div class="stat">${exams.length}</div><div class="stat-label">إجمالي الاختبارات</div></div>
    <div class="card"><div class="stat">${completed}</div><div class="stat-label">اختبارات مكتملة</div></div>
    <div class="card"><div class="stat">${pending}</div><div class="stat-label">اختبارات معلقة</div></div>
    <div class="card"><div class="stat">${avg}%</div><div class="stat-label">متوسط الدرجات</div></div>
    <div class="card"><div class="stat">${passRate}%</div><div class="stat-label">نسبة النجاح</div></div>

function resultsTable(results,emps,exams,withChk){
  if(!results.length) return '<p style="color:var(--muted)">لا توجد نتائج بعد.</p>';
  return `<div class="table-wrap"><table><tr>${withChk?'<th><input type="checkbox" id="resSelectAll"></th>':''}<th>الموظف</th><th>الاختبار</th><th>النسبة</th><th>الحالة</th></tr>
  ${results.map(r=>{
    const e=emps.find(x=>x.id===r.employeeId); const ex=exams.find(x=>x.id===r.examId);
    return `<tr>${withChk?`<td><input type="checkbox" class="resChk" value="${r.id}"></td>`:''}<td>${e?e.name:'-'}</td><td>${ex?ex.name:'-'}</td><td>${r.percent}%</td>
    <td><span class="badge ${r.passed?'ok':'bad'}">${r.passed?'ناجح':'راسب'}</span></td></tr>`;
  }).join('')}</table></div>`;
}

async function questionsView(){
  const qs = await listAll('questions');
  return `<h1>بنك الأسئلة</h1>
  <div class="card">
    <div class="row">
      <div><label>نص السؤال</label><input id="qText" style="width:100%"></div>
      <div><label>النوع</label><select id="qType" style="width:100%">
        <option value="mcq">اختيار من متعدد</option><option value="tf">صح / خطأ</option>
        <option value="multi">اختيار متعدد</option><option value="short">إجابة قصيرة</option>
      </select></div>
      <div><label>التصنيف</label><input id="qCat" style="width:100%"></div>
      <div><label>الدرجة</label><input id="qPoints" type="number" value="1" style="width:100%"></div>
    </div>
    <div id="qOptsWrap"></div>
    <label>شرح الإجابة (اختياري)</label><input id="qExpl" style="width:100%">

  </div>

  <input id="qSearch" placeholder="بحث..." style="width:100%;margin-bottom:8px">

  <div id="qList">${renderQList(qs)}</div></div>`;

function renderQList(qs){
  if(!qs.length) return '<p style="color:var(--muted)">لا توجد أسئلة.</p>';
  return `<div class="table-wrap"><table><tr><th><input type="checkbox" id="qSelectAll"></th><th>السؤال</th><th>النوع</th><th>التصنيف</th><th>الدرجة</th><th></th></tr>
  ${qs.map(q=>`<tr><td><input type="checkbox" class="qChk" value="${q.id}"></td><td>${q.text}</td><td>${typeLabel(q.type)}</td><td>${q.category||'-'}</td><td>${q.points}</td>
  <td><button class="btn danger" data-del="${q.id}" style="padding:4px 10px">حذف</button></td></tr>`).join('')}</table></div>`;
}
function typeLabel(t){ return {mcq:'اختيار واحد',tf:'صح/خطأ',multi:'اختيار متعدد',short:'إجابة قصيرة'}[t]||t; }

function optsEditor(type){
  if(type==='tf') return `<label>الإجابة الصحيحة</label><select id="qCorrectTF"><option value="true">صح</option><option value="false">خطأ</option></select>`;
  if(type==='short') return `<label>الإجابة الصحيحة (نص)</label><input id="qShortAns" style="width:100%">`;
  let html='<label>الاختيارات (علّم الصحيح)</label>';
  for(let i=0;i<4;i++){
    html+=`<div class="qopt"><input type="${type==='multi'?'checkbox':'radio'}" name="qc" value="${i}">
    <input data-opt="${i}" placeholder="اختيار ${i+1}" style="flex:1"></div>`;
  }
  return html;
}

function attachQuestions(){
  const typeSel=document.getElementById('qType');
  const wrap=document.getElementById('qOptsWrap');
  const refresh=()=>wrap.innerHTML=optsEditor(typeSel.value);
  typeSel.onchange=refresh; refresh();
  document.getElementById('addQ').onclick=async ()=>{
    const type=typeSel.value, text=document.getElementById('qText').value.trim();
    if(!text) return alert('أدخل نص السؤال');
    let options=[], correct=null;
    if(type==='tf'){ correct=document.getElementById('qCorrectTF').value==='true'; }
    else if(type==='short'){ correct=document.getElementById('qShortAns').value.trim(); }
    else {
      const opts=[...wrap.querySelectorAll('[data-opt]')].map(i=>i.value.trim());
      options=opts;
      if(type==='mcq'){ const r=wrap.querySelector('input[name=qc]:checked'); correct=r?parseInt(r.value):null; }
      else { correct=[...wrap.querySelectorAll('input[name=qc]:checked')].map(c=>parseInt(c.value)); }
    }
    const q={text,type,options,correct,points:parseFloat(document.getElementById('qPoints').value)||1,
      category:document.getElementById('qCat').value.trim(),explanation:document.getElementById('qExpl').value.trim()};
    await setDoc('questions',uid(),q);
    state.view='questions'; routeRender();
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ await delDoc('questions',b.dataset.del); state.view='questions'; routeRender(); });
  document.getElementById('qSearch').oninput=async (e)=>{
    const qs=await listAll('questions');
    const f=qs.filter(q=>q.text.includes(e.target.value)||((q.category||'').includes(e.target.value)));
    document.getElementById('qList').innerHTML=renderQList(f);
    attachSelectAll('qSelectAll','qChk');
  };
  document.getElementById('qBulkDelete').onclick=()=>bulkDeleteSelected('questions','qChk');
  attachSelectAll('qSelectAll','qChk');
}

function attachAssign(){
  let allEmps = [], allLeaders = [];

  const updateEmpsList = () => {
    const deptVal = document.getElementById('aDept').value;
    const teamVal = document.getElementById('aTeam').value;
    const container = document.getElementById('assignEmpsContainer');
    
    let filtered = allEmps;
    if (deptVal) filtered = filtered.filter(e => e.dept === deptVal);
    if (teamVal) filtered = filtered.filter(e => e.teamLeaderId === teamVal);

    if(!filtered.length){
      container.innerHTML = '<p style="color:var(--muted);margin:0;font-size:13px">لا يوجد موظفون يطابقون خيارات البحث الحالية.</p>';
      return;
    }

    container.innerHTML = filtered.map(e => {
      const ld = allLeaders.find(l=>l.id===e.teamLeaderId);
      return `<div class="qopt">
        <input type="checkbox" class="assignEmpChk" value="${e.id}">
        <span>${e.name} <small style="color:var(--muted)">(${e.dept || 'بدون قسم'}${ld ? ' - فريق: '+ld.name : ''})</small></span>
      </div>`;
    }).join('');

    const pickAll = document.getElementById('aPickAllEmps');
    if(pickAll) pickAll.checked = false;
  };

  const updateTeamsOptions = () => {
    const deptVal = document.getElementById('aDept').value;
    const teamSelect = document.getElementById('aTeam');
    let validLeaders = allLeaders;
    
    if (deptVal) {
      const deptsEmps = allEmps.filter(e => e.dept === deptVal);
      const leaderIds = [...new Set(deptsEmps.map(e => e.teamLeaderId).filter(Boolean))];
      validLeaders = allLeaders.filter(l => leaderIds.includes(l.id));
    }
    
    teamSelect.innerHTML = `<option value="">-- كل الفرق --</option>` + 
      validLeaders.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
  };

  Promise.all([listAll('employees'), listAll('teamLeaders')]).then(([emps, leaders]) => {
    allEmps = emps;
    allLeaders = leaders;
    updateEmpsList();
  });

  document.getElementById('aDept').onchange = () => {
    updateTeamsOptions();
    updateEmpsList();
  };
  
  document.getElementById('aTeam').onchange = () => {
    updateEmpsList();
  };

  const pickAll = document.getElementById('aPickAllEmps');
  if(pickAll) {
    pickAll.onchange = () => {
      document.querySelectorAll('.assignEmpChk').forEach(chk => chk.checked = pickAll.checked);
    };
  }

  document.getElementById('doAssign').onclick = async () => {
    const examId = document.getElementById('aExam').value;
    const deadline = document.getElementById('aDeadline').value;
    if (!examId) return alert('اختر اختبارًا');

    const selectedEmpIds = [...document.querySelectorAll('.assignEmpChk:checked')].map(c => c.value);
    if (!selectedEmpIds.length) {
      alert('يرجى تحديد موظف واحد على الأقل لإسناد الاختبار إليه.');
      return;
    }

    for (const id of selectedEmpIds) {
      await setDoc('assignments', uid(), { examId, employeeId: id, deadline });
    }

    alert(`تم إسناد الاختبار بنجاح إلى ${selectedEmpIds.length} موظف.`);
    state.view = 'assign';
    routeRender();
  };

  const aBulk = document.getElementById('aBulkDelete');
  if (aBulk) aBulk.onclick = () => bulkDeleteSelected('assignments', 'aChk');
  attachSelectAll('aSelectAll', 'aChk');
}

// ---------- ADMIN: wrong answers ----------
function formatAnswerText(q,val){
  if(val===undefined||val===null||val==='') return '<span style="color:var(--muted)">لم يُجب</span>';
  if(q.type==='mcq') return (q.options&&q.options[val]!==undefined)? q.options[val] : String(val);
  if(q.type==='tf') return val===true?'صح':'خطأ';
  if(q.type==='multi') return Array.isArray(val)? val.map(i=>(q.options&&q.options[i]!==undefined)?q.options[i]:i).join('، ') : String(val);
  return String(val);
}
function formatCorrectText(q){
  if(q.type==='mcq') return (q.options&&q.options[q.correct]!==undefined)? q.options[q.correct] : String(q.correct);
  if(q.type==='tf') return q.correct===true?'صح':'خطأ';
  if(q.type==='multi') return Array.isArray(q.correct)? q.correct.map(i=>(q.options&&q.options[i]!==undefined)?q.options[i]:i).join('، ') : String(q.correct);
  return String(q.correct);
}
function isAnswerWrong(q,val){
  if(val===undefined||val===null||val==='') return false;
  if(q.type==='mcq') return val!==q.correct;
  if(q.type==='tf') return val!==q.correct;
  if(q.type==='multi'){
    if(!Array.isArray(val)||!Array.isArray(q.correct)) return true;
    return !(val.length===q.correct.length && val.every(v=>q.correct.includes(v)));
  }
  if(q.type==='short') return (String(val).trim().toLowerCase())!==(String(q.correct||'').trim().toLowerCase());
  return false;
}
async function buildWrongAnswerRows(){
  const [results0,emps,exams,questions]=await Promise.all([listAll('results'),listAll('employees'),listAll('exams'),listAll('questions')]);
  const results=filterResultsForLeader(results0,emps,exams);
  const rows=[];
  results.forEach(r=>{
    const emp=emps.find(e=>e.id===r.employeeId), exam=exams.find(x=>x.id===r.examId);
    if(!exam) return;
    (exam.questionIds||[]).forEach(qid=>{
      const q=questions.find(x=>x.id===qid); if(!q) return;
      const val=r.answers?r.answers[q.id]:undefined;
      if(isAnswerWrong(q,val)){
        rows.push({
          employeeName: emp?emp.name:'(موظف محذوف)',
          empId: emp?emp.empId:'-',
          examName: exam.name,
          questionText: q.text,
          employeeAnswer: formatAnswerText(q,val),
          correctAnswer: formatCorrectText(q),
          when: r.endTime || r.startTime || 0
        });
      }
    });
  });
  rows.sort((a,b)=>b.when-a.when);
  return rows;
}
function renderWrongAnswerTable(rows){
  if(!rows.length) return '<p style="color:var(--muted)">لا توجد إجابات خاطئة مسجّلة حتى الآن.</p>';
  return `<div class="table-wrap"><table><tr><th>الموظف</th><th>Employee ID</th><th>الاختبار</th><th>السؤال</th><th>إجابة الموظف</th><th>الإجابة الصحيحة</th><th>التاريخ</th></tr>
  ${rows.map(r=>`<tr><td>${r.employeeName}</td><td>${r.empId}</td><td>${r.examName}</td><td>${r.questionText}</td>
  <td style="color:var(--bad)">${r.employeeAnswer}</td><td style="color:var(--ok)">${r.correctAnswer}</td>
  <td>${r.when?new Date(r.when).toLocaleString('ar-EG'):'-'}</td></tr>`).join('')}</table></div>`;
}
async function wrongAnswersView(){
  const rows=await buildWrongAnswerRows();
  return `<h1>الإجابات الخاطئة</h1>
  <div class="card">
    <p style="color:var(--muted);font-size:13px">كل الأسئلة التي أجاب عليها الموظفون إجابة خاطئة بعد انتهاء اختباراتهم، مع توضيح من أجاب وبأي إجابة.</p>
    <div class="row">
      <div><input id="waSearch" placeholder="بحث باسم الموظف أو اسم الاختبار..." style="width:100%"></div>
      <div><button class="btn sec" id="waExport">تصدير CSV</button></div>
    </div>
    <div id="waList" style="margin-top:10px">${renderWrongAnswerTable(rows)}</div>
  </div>`;
}
function attachWrongAnswers(){
  document.getElementById('waSearch').oninput=async (e)=>{
    const rows=await buildWrongAnswerRows();
    const term=e.target.value.trim();
    const f=term? rows.filter(r=>r.employeeName.includes(term)||r.examName.includes(term)) : rows;
    document.getElementById('waList').innerHTML=renderWrongAnswerTable(f);
  };
  document.getElementById('waExport').onclick=async ()=>{
    const rows=await buildWrongAnswerRows();
    let csv='Employee,Employee ID,Exam,Question,Employee Answer,Correct Answer,Date\n';
    rows.forEach(r=>{
      const esc=(s)=>'"'+String(s).replace(/<[^>]+>/g,'').replace(/"/g,'""')+'"';
      csv+=`${esc(r.employeeName)},${esc(r.empId)},${esc(r.examName)},${esc(r.questionText)},${esc(r.employeeAnswer)},${esc(r.correctAnswer)},${esc(r.when?new Date(r.when).toLocaleString('ar-EG'):'-')}\n`;
    });
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='wrong-answers.csv'; a.click(); URL.revokeObjectURL(url);
  };
}

function attachReviewExams(){
  if (state.editingExamId) {
    document.getElementById('cancelExamEdit').onclick=()=>{ state.editingExamId=null; state.view='review-exams'; routeRender(); };
    const isNew = state.editingExamId==='NEW';
    const gather=()=>{
      const name=document.getElementById('editEName').value.trim();
      const questionIds=[...document.querySelectorAll('.pickEditQ:checked')].map(c=>c.value);
      return { ok: !!name, name,
        data:{
          name, dept:document.getElementById('editEDept').value.trim(), desc:document.getElementById('editEDesc').value.trim(),
          duration:parseInt(document.getElementById('editEDur').value)||30, passScore:parseInt(document.getElementById('editEPass').value)||60,
          attempts:parseInt(document.getElementById('editEAttempts').value)||1,
          startDate:document.getElementById('editEStart').value, endDate:document.getElementById('editEEnd').value,
          randomQ:document.getElementById('editERandomQ').checked, randomA:document.getElementById('editERandomA').checked,
          showResult:document.getElementById('editEShowResult').checked, showAnswers:document.getElementById('editEShowAns').checked,
          questionIds
        }
      };
    };
    if(isNew){
      const saveNew=async(active)=>{
        const g=gather();
        if(!g.ok) return alert('أدخل اسم الاختبار');
        await setDoc('exams',uid(),{...g.data, active, draft:!active, createdAt:Date.now(), createdBy:isLeaderSession()?state.session.id:'admin'});
        alert('تم إنشاء الاختبار بنجاح');
        state.editingExamId=null; state.view='review-exams'; routeRender();
      };
      document.getElementById('saveExamDraft').onclick=()=>saveNew(false);
      document.getElementById('saveExamActive').onclick=()=>saveNew(true);
    } else {
      document.getElementById('saveExamEdit').onclick=async ()=>{
        const g=gather();
        if(!g.ok) return alert('أدخل اسم الاختبار');
        await setDoc('exams',state.editingExamId,g.data);
        alert('تم تحديث الاختبار بنجاح');
        state.editingExamId=null; state.view='review-exams'; routeRender();
      };
    }
    return;
  }

  const newBtn=document.getElementById('newExamBtn');
  if(newBtn) newBtn.onclick=()=>{ state.editingExamId='NEW'; state.view='review-exams'; routeRender(); };
  document.querySelectorAll('[data-editexam]').forEach(b=>b.onclick=()=>{
    state.editingExamId=b.dataset.editexam;
    state.view='review-exams';
    routeRender();
  });
  document.querySelectorAll('[data-toggleactive]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.toggleactive;
    const exams=await listAll('exams');
    const exam=exams.find(x=>x.id===id);
    if(exam) await setDoc('exams',id,{active:!exam.active, draft:exam.active});
    state.view='review-exams'; routeRender();
  });
  document.querySelectorAll('[data-delexam]').forEach(b=>b.onclick=async()=>{
    if(!confirm('هل أنت متأكد من حذف هذا الاختبار؟')) return;
    await delDoc('exams',b.dataset.delexam);
    state.view='review-exams'; routeRender();
  });
}

// ---------- LEADER/ADMIN: exam grading by team leader ----------
let gradingSelected=null, gradingLeaderId='', gradingExamId='';
function examTotalPoints(exam,questions){
  return (exam.questionIds||[]).reduce((a,qid)=>{ const q=questions.find(x=>x.id===qid); return a+(q?Number(q.points)||0:0); },0);
}
function autoPoints(q,val){
  if(val===undefined||val===null||val==='') return 0;
  return isAnswerWrong(q,val)?0:(Number(q.points)||0);
}
async function gradingView(){
  const s=state.session;
  const isLeader=s.role==='leader';
  const [results,emps,exams,questions,leaders]=await Promise.all([listAll('results'),listAll('employees'),listAll('exams'),listAll('questions'),listAll('teamLeaders')]);
  const leaderId = isLeader ? s.id : gradingLeaderId;
  const teamEmps = emps.filter(e=> leaderId ? e.teamLeaderId===leaderId : !!e.teamLeaderId);
  const teamIds = new Set(teamEmps.map(e=>e.id));
  let teamResults = results.filter(r=>teamIds.has(r.employeeId));
  const examOptions = exams.filter(x=>teamResults.some(r=>r.examId===x.id));
  if(gradingExamId && !examOptions.some(x=>x.id===gradingExamId)) gradingExamId='';
  if(gradingExamId) teamResults = teamResults.filter(r=>r.examId===gradingExamId);
  teamResults.sort((a,b)=>(b.endTime||0)-(a.endTime||0));

  const pendingCount = teamResults.filter(r=>r.gradeStatus!=='graded').length;
  const rows = teamResults.map(r=>{
    const emp=emps.find(e=>e.id===r.employeeId), exam=exams.find(x=>x.id===r.examId);
    const total = exam?examTotalPoints(exam,questions):0;
    const graded = r.gradeStatus==='graded';
    return `<tr>
      <td>${emp?emp.name:'(موظف محذوف)'}</td>
      <td>${exam?exam.name:'(اختبار محذوف)'}</td>
      <td>${r.score} / ${total}</td>
      <td>${r.percent}%</td>
      <td>${graded?`<span class="badge ok">تم التصحيح${r.gradedByName?' — '+r.gradedByName:''}</span>`:'<span class="badge warn">بانتظار التصحيح</span>'}</td>
      <td>${r.endTime?new Date(r.endTime).toLocaleString('ar-EG'):'-'}</td>
      <td><button class="btn" data-grade="${r.id}" style="padding:4px 10px">${graded?'إعادة التصحيح':'تصحيح'}</button></td>
    </tr>`;
  }).join('');

  let detail='';
  if(gradingSelected){
    const r=results.find(x=>x.id===gradingSelected);
    const emp=r?emps.find(e=>e.id===r.employeeId):null;
    const exam=r?exams.find(x=>x.id===r.examId):null;
    if(r && exam && emp && (isLeader ? emp.teamLeaderId===s.id : true)){
      const qRows=(exam.questionIds||[]).map(qid=>{
        const q=questions.find(x=>x.id===qid); if(!q) return '';
        const val=r.answers?r.answers[q.id]:undefined;
        const max=Number(q.points)||0;
        const cur=(r.manualGrades && r.manualGrades[q.id]!==undefined)? r.manualGrades[q.id] : autoPoints(q,val);
        const wrong=isAnswerWrong(q,val);
        return `<tr>
          <td style="white-space:normal;min-width:180px">${q.text}</td>
          <td style="color:${wrong||val===undefined?'var(--bad)':'var(--ok)'};white-space:normal">${formatAnswerText(q,val)}</td>
          <td style="color:var(--ok);white-space:normal">${formatCorrectText(q)}</td>
          <td>${max}</td>
          <td><input type="number" class="gradeInp" data-qid="${q.id}" data-max="${max}" min="0" max="${max}" step="0.5" value="${cur}" style="width:80px"></td>
        </tr>`;
      }).join('');
      detail=`<div class="card" id="gradeCard">
        <h3>تصحيح: ${emp.name} — ${exam.name}</h3>
        <div class="table-wrap"><table><tr><th>السؤال</th><th>إجابة الموظف</th><th>الإجابة الصحيحة</th><th>الدرجة الكاملة</th><th>الدرجة الممنوحة</th></tr>${qRows}</table></div>
        <p style="margin-top:10px"><strong>المجموع: <span id="gradeSum">0</span> / ${examTotalPoints(exam,questions)}</strong> — النسبة: <span id="gradePct">0</span>% — <span id="gradeVerdict"></span></p>
        <label>ملاحظات / إرشادات للموظف (اختياري)</label>
        <textarea id="gradeFeedback" rows="3" style="width:100%">${r.gradeFeedback||''}</textarea>
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="saveGrade" data-rid="${r.id}">حفظ التصحيح</button>
          <button class="btn sec" id="closeGrade">إغلاق</button>
        </div>
      </div>`;
    }
  }

  const adminPicker = isLeader ? '' : `<div><label>قائد الفريق</label><select id="gLeader" style="width:100%"><option value="">-- كل الفرق --</option>${leaders.map(l=>`<option value="${l.id}" ${l.id===gradingLeaderId?'selected':''}>${l.name}</option>`).join('')}</select></div>`;
  return `<h1>تصحيح الاختبار</h1>
  <div class="card">
    <p style="color:var(--muted);font-size:13px">${isLeader?'اختبارات موظفي فريقك فقط. ':''}قائد الفريق هو المسؤول عن تصحيح اختبارات فريقه ومنح الدرجات لكل سؤال، والنتيجة النهائية تُحدَّث للموظف تلقائيًا.</p>
    <div class="row">
      ${adminPicker}
      <div><label>الاختبار</label><select id="gExam" style="width:100%"><option value="">-- كل الاختبارات --</option>${examOptions.map(x=>`<option value="${x.id}" ${x.id===gradingExamId?'selected':''}>${x.name}</option>`).join('')}</select></div>
    </div>
    <p style="margin-top:10px">بانتظار التصحيح: <strong>${pendingCount}</strong> من ${teamResults.length}</p>
    <div class="table-wrap"><table><tr><th>الموظف</th><th>الاختبار</th><th>الدرجة</th><th>النسبة</th><th>الحالة</th><th>تاريخ التسليم</th><th></th></tr>
    ${rows || '<tr><td colspan="7" style="color:var(--muted)">لا توجد اختبارات مسلَّمة من موظفي هذا الفريق بعد.</td></tr>'}</table></div>
  </div>
  ${detail}`;
}
function attachGrading(){
  const s=state.session;
  const gl=document.getElementById('gLeader'); if(gl) gl.onchange=()=>{ gradingLeaderId=gl.value; gradingSelected=null; routeRender(); };
  const ge=document.getElementById('gExam'); if(ge) ge.onchange=()=>{ gradingExamId=ge.value; gradingSelected=null; routeRender(); };
  document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{
    gradingSelected=b.dataset.grade; routeRender();
    setTimeout(()=>document.getElementById('gradeCard')?.scrollIntoView({behavior:'smooth',block:'start'}),150);
  });
  const card=document.getElementById('gradeCard'); if(!card) return;
  document.getElementById('closeGrade').onclick=()=>{ gradingSelected=null; routeRender(); };
  const inputs=[...card.querySelectorAll('.gradeInp')];
  let passScore=60, total=0;
  Promise.all([listAll('results'),listAll('exams'),listAll('questions')]).then(([results,exams,questions])=>{
    const r=results.find(x=>x.id===gradingSelected); const exam=r&&exams.find(x=>x.id===r.examId);
    if(exam){ passScore=exam.passScore||60; total=examTotalPoints(exam,questions); }
    recalc();
  });
  function clampVal(inp){ let v=parseFloat(inp.value); const max=parseFloat(inp.dataset.max)||0; if(isNaN(v)||v<0) v=0; if(v>max) v=max; return v; }
  function recalc(){
    const sum=inputs.reduce((a,i)=>a+clampVal(i),0);
    const pct= total? Math.round(sum/total*100):0;
    document.getElementById('gradeSum').textContent=sum;
    document.getElementById('gradePct').textContent=pct;
    const v=document.getElementById('gradeVerdict');
    v.innerHTML = pct>=passScore ? '<span class="badge ok">ناجح</span>' : '<span class="badge bad">راسب</span>';
  }
  inputs.forEach(i=>i.oninput=recalc);
  document.getElementById('saveGrade').onclick=async()=>{
    const rid=document.getElementById('saveGrade').dataset.rid;
    const [results,exams,questions,emps]=await Promise.all([listAll('results'),listAll('exams'),listAll('questions'),listAll('employees')]);
    const r=results.find(x=>x.id===rid); const exam=r&&exams.find(x=>x.id===r.examId); const emp=r&&emps.find(e=>e.id===r.employeeId);
    if(!r||!exam||!emp){ alert('تعذر العثور على النتيجة.'); return; }
    if(s.role==='leader' && emp.teamLeaderId!==s.id){ alert('هذا الموظف ليس من فريقك.'); return; }
    const manualGrades={}; let sum=0;
    inputs.forEach(i=>{ const v=clampVal(i); manualGrades[i.dataset.qid]=v; sum+=v; });
    const tot=examTotalPoints(exam,questions);
    const percent= tot? Math.round(sum/tot*100):0;
    const leaders=await listAll('teamLeaders');
    const gName = s.role==='leader' ? s.name : ((leaders.find(l=>l.id===emp.teamLeaderId)||{}).name || 'المدير');
    const ok=await setDoc('results',rid,{manualGrades,score:sum,percent,passed:percent>=(exam.passScore||60),
      reviewStatus:null,gradeStatus:'graded',gradedBy:s.role==='leader'?s.id:'admin',gradedByName:gName,
      gradedAt:Date.now(),gradeFeedback:document.getElementById('gradeFeedback').value.trim()});
    if(ok){ alert('تم حفظ التصحيح والدرجات.'); gradingSelected=null; routeRender(); }
  };
}

// ---------- EMPLOYEE: take exam ----------
let timerInterval=null;
async function takeExamView(){
  const exams=await listAll('exams'); const exam=exams.find(e=>e.id===state.examAttempt.examId);
  if(!exam) return '<p>الاختبار غير موجود.</p>';
  const allQs=await listAll('questions');
  let qs = exam.questionIds.map(id=>allQs.find(q=>q.id===id)).filter(Boolean);
  if(!state.examAttempt.order){
    let order=qs.map((_,i)=>i);
    if(exam.randomQ) order.sort(()=>Math.random()-0.5);
    state.examAttempt.order=order;
    state.examAttempt.endAt=Date.now()+exam.duration*60000;
  }
  state.examAttempt.qs=qs;
  const order=state.examAttempt.order;
  const i=state.examAttempt.idx;
  const q=qs[order[i]];
  const answers=state.examAttempt.answers;
  return `<h1>${exam.name}</h1>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div>السؤال ${i+1} من ${qs.length}</div><div class="timer" id="timerBox">--:--</div>
  </div>
  <div class="card">
    <p style="font-size:15px">${q.text}</p>
    <div id="answerArea">${answerInput(q,answers[q.id])}</div>
  </div>
  <div class="card">
    <button class="btn sec" id="prevQ" ${i===0?'disabled':''}>السابق</button>
    <button class="btn sec" id="nextQ" ${i===qs.length-1?'disabled':''}>التالي</button>
    <button class="btn" id="submitExam" style="float:left">تسليم الاختبار</button>
  </div>
  <div class="card qnav">${order.map((oi,pos)=>`<button class="${answers[qs[oi].id]!==undefined?'answered':''} ${pos===i?'current':''}" data-jump="${pos}">${pos+1}</button>`).join('')}</div>`;
}
function answerInput(q,val){
  if(q.type==='mcq'||q.type==='tf'){
    const opts = q.type==='tf'? ['صح','خطأ'] : q.options;
    return opts.map((o,idx)=>{
      const v=q.type==='tf'? (idx===0?'true':'false') : idx;
      return `<div class="qopt"><input type="radio" name="ans" value="${v}" ${String(val)===String(v)?'checked':''}><span>${o}</span></div>`;
    }).join('');
  }
  if(q.type==='multi'){
    return q.options.map((o,idx)=>`<div class="qopt"><input type="checkbox" name="ansM" value="${idx}" ${Array.isArray(val)&&val.includes(idx)?'checked':''}><span>${o}</span></div>`).join('');
  }
  return `<input id="ansShort" style="width:100%" value="${val||''}">`;
}
function saveCurrentAnswer(){
  const ea=state.examAttempt; const q=ea.qs[ea.order[ea.idx]];
  if(q.type==='mcq'||q.type==='tf'){ const r=document.querySelector('input[name=ans]:checked'); if(r) ea.answers[q.id]= q.type==='tf'? r.value==='true' : parseInt(r.value); }
  else if(q.type==='multi'){ const cs=[...document.querySelectorAll('input[name=ansM]:checked')].map(c=>parseInt(c.value)); if(cs.length) ea.answers[q.id]=cs; }
  else { const el=document.getElementById('ansShort'); if(el) ea.answers[q.id]=el.value; }
}
function attachTakeExam(){
  const ea=state.examAttempt;
  clearInterval(timerInterval);
  const tick=()=>{
    const left=ea.endAt-Date.now();
    const box=document.getElementById('timerBox'); if(!box) return;
    if(left<=0){ clearInterval(timerInterval); finishExam(); return; }
    const m=Math.floor(left/60000), s2=Math.floor((left%60000)/1000);
    box.textContent=`${m}:${s2.toString().padStart(2,'0')}`;
  };
  tick(); timerInterval=setInterval(tick,1000);
  document.getElementById('prevQ').onclick=()=>{ saveCurrentAnswer(); ea.idx--; state.view='take-exam'; routeRender(); };
  document.getElementById('nextQ').onclick=()=>{ saveCurrentAnswer(); ea.idx++; state.view='take-exam'; routeRender(); };
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{ saveCurrentAnswer(); ea.idx=parseInt(b.dataset.jump); state.view='take-exam'; routeRender(); });
  document.getElementById('submitExam').onclick=()=>{ saveCurrentAnswer(); if(confirm('هل أنت متأكد من تسليم الاختبار؟')) finishExam(); };
}
async function finishExam(){
  clearInterval(timerInterval);
  const ea=state.examAttempt; const exams=await listAll('exams'); const exam=exams.find(e=>e.id===ea.examId);
  let score=0,total=0;
  ea.qs.forEach(q=>{
    total+=q.points; const a=ea.answers[q.id];
    if(q.type==='mcq'){ if(a===q.correct) score+=q.points; }
    else if(q.type==='tf'){ if(a===q.correct) score+=q.points; }
    else if(q.type==='multi'){ if(Array.isArray(a)&&Array.isArray(q.correct)&&a.length===q.correct.length&&a.every(v=>q.correct.includes(v))) score+=q.points; }
    else if(q.type==='short'){ if((a||'').trim().toLowerCase()===((q.correct||'').trim().toLowerCase())) score+=q.points; }
  });
  const percent = total? Math.round(score/total*100):0;
  const passed = percent>=exam.passScore;
  const prevResults=(await listAll('results')).filter(r=>r.examId===exam.id && r.employeeId===state.session.id);
  await setDoc('results',uid(),{examId:exam.id,employeeId:state.session.id,score,percent,passed,
    startTime:ea.startTime,endTime:Date.now(),durationSec:Math.round((Date.now()-ea.startTime)/1000),
    attemptNum:prevResults.length+1, answers:ea.answers});
  state.examAttempt=null;
  alert(exam.showResult? `انتهى الاختبار. النتيجة: ${percent}% - ${passed?'ناجح':'راسب'}` : 'تم تسليم الاختبار بنجاح.');
  state.view='emp-home'; location.hash='emp-home'; routeRender();
}
