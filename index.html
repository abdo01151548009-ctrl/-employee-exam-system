<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Employee Exam System</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
  --brand:#2563eb; --brand-d:#1d4ed8; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1420; --surface:#171d2b; --text:#e5e7eb; --muted:#9aa4b2; --border:#2a3242; }
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--surface);border-left:1px solid var(--border);padding:16px;flex-shrink:0}
.sidebar h2{font-size:16px;color:var(--brand)}
.sidebar .user{font-size:13px;color:var(--muted);margin-bottom:14px}
.nav a{display:block;padding:9px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px;margin-bottom:3px}
.nav a.active,.nav a:hover{background:var(--brand);color:#fff}
.main{flex:1;padding:20px;max-width:1100px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
.card table tr{display:table-row}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{font-size:26px;font-weight:700;color:var(--brand)}
.stat-label{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:right}
th{color:var(--muted);font-weight:600}
.btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px}
.btn:hover{background:var(--brand-d)}
.btn.sec{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--bad)}
.badge{padding:2px 8px;border-radius:999px;font-size:11px}
.badge.ok{background:#dcfce7;color:#166534}
.badge.bad{background:#fee2e2;color:#991b1b}
.badge.warn{background:#fef3c7;color:#92400e}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.menuBtn{display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:16px;color:var(--text)}
.topbar{display:none}
@media (max-width:760px){
  .app{flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border-bottom:1px solid var(--border);padding:10px 14px;position:sticky;top:0;z-index:20;
    padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar h2{font-size:15px;margin:0;color:var(--brand)}
  .menuBtn{display:block}
  .sidebar{position:fixed;inset:0;z-index:30;width:100%;height:100%;transform:translateX(100%);
    transition:transform .2s ease;overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .sidebar.open{transform:translateX(0)}
  .sidebar .closeBtn{display:block;background:transparent;border:none;font-size:20px;color:var(--text);
    position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px}
  .nav a{font-size:16px;padding:12px 10px}
  .main{padding:12px;max-width:100%}
  h1{font-size:17px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
  .stat{font-size:20px}
  .card{padding:12px}
  table{font-size:12px}
  th,td{padding:6px}
  .row>div{min-width:100%}
  .login{margin:30px auto;max-width:100%;padding:20px}
  .qnav button{width:30px;height:30px;margin:2px}
  .timer{font-size:15px;padding:5px 10px}
}
.sidebar .closeBtn{display:none}
h1{font-size:20px;margin:0 0 14px}
.qopt{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.timer{font-size:18px;font-weight:700;color:var(--bad);background:var(--surface);padding:6px 14px;border-radius:8px;border:1px solid var(--border)}
.login{max-width:380px;margin:60px auto;text-align:center}
.qnav button{width:34px;height:34px;border-radius:6px;border:1px solid var(--border);background:var(--surface);margin:2px;color:var(--text)}
.qnav button.answered{background:#dbeafe}
.qnav button.current{outline:2px solid var(--brand)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBiJaBC-gIoBKOqXnXybOCf_pKiKyB6-EA",
  authDomain: "employee-exam-system.firebaseapp.com",
  projectId: "employee-exam-system",
  storageBucket: "employee-exam-system.firebasestorage.app",
  messagingSenderId: "524658380745",
  appId: "1:524658380745:web:06145dff2b431c56bba218"
};
firebase.initializeApp(firebaseConfig);

let db=null;
let state={ session:null, view:'login', examAttempt:null };

async function initCaps(){
  try{ db = firebase.firestore(); }catch(e){ db=null; console.error(e); }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function col(name){ return db ? db.collection(name) : null; }

async function listAll(name){
  if(!db) return [];
  try{
    const c = db.collection(name);
    const res = await c.get();
    return res.docs ? res.docs.map(d=>({id:d.id,...(d.data()||{})})) : [];
  }catch(e){ console.error(e); return []; }
}
async function setDoc(name,id,data){
  if(!db){ alert('تعذر الاتصال بقاعدة البيانات. أعد تحميل الصفحة وحاول مرة أخرى.'); return false; }
  try{ await db.collection(name).doc(id).set(data,{merge:true}); return true; }
  catch(e){ console.error(e); alert('حدث خطأ أثناء الحفظ: '+(e&&e.message?e.message:'غير معروف')); return false; }
}
async function delDoc(name,id){ if(!db) return; try{ await db.collection(name).doc(id).delete(); }catch(e){console.error(e);} }
async function bulkDeleteSelected(collectionName,chkClass){
  const ids=[...document.querySelectorAll('.'+chkClass+':checked')].map(c=>c.value);
  if(!ids.length){ alert('اختر عنصرًا واحدًا على الأقل للحذف.'); return; }
  if(!confirm(`هل أنت متأكد من حذف ${ids.length} عنصر؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
  for(const id of ids) await delDoc(collectionName,id);
  routeRender();
}
function attachSelectAll(allId,chkClass){
  const allBox=document.getElementById(allId); if(!allBox) return;
  allBox.onchange=()=>{ document.querySelectorAll('.'+chkClass).forEach(c=>c.checked=allBox.checked); };
}

// ---------- render shell ----------
function render(){
  const root=document.getElementById('root');
  if(!state.session){ root.innerHTML=loginView(); attachLogin(); return; }
  root.innerHTML = shell();
  attachShellNav();
  routeRender();
}

function shell(){
  const s=state.session;
  const adminLinks=[
    ['dashboard','لوحة التحكم'],['create-exam','إنشاء اختبار'],['questions','بنك الأسئلة'],
    ['employees','الموظفون'],['assign','إسناد الاختبارات'],['results','النتائج'],['wrong-answers','الإجابات'],
    ['review-exams','تعديل الاختبار'],['messages','مراسلات'],['settings','الإعدادات']
  ];
  const empLinks=[['emp-home','اختباراتي'],['emp-results','نتائجي السابقة'],['emp-messages','مراسلات']];
  const links = s.role==='admin'?adminLinks:empLinks;
  return `<div class="app">
    <div class="topbar">
      <button class="menuBtn" id="openMenu">☰</button>
      <h2>Employee Exam System</h2>
      <span style="width:38px"></span>
    </div>
    <div class="sidebar" id="sidebar">
      <button class="closeBtn" id="closeMenu">✕</button>
      <h2>Employee Exam System</h2>
      <div class="user">${s.role==='admin'?'مدير النظام':s.name}</div>
      <div class="nav">${links.map(l=>`<a href="#${l[0]}" class="${state.view===l[0]?'active':''}">${l[1]}</a>`).join('')}
      <a href="#logout" style="color:var(--bad)">تسجيل الخروج</a></div>
    </div>
    <div class="main" id="main"></div>
  </div>`;
}
function attachShellNav(){
  const sb=document.getElementById('sidebar');
  const open=document.getElementById('openMenu'), close=document.getElementById('closeMenu');
  if(open) open.onclick=()=>sb.classList.add('open');
  if(close) close.onclick=()=>sb.classList.remove('open');
  sb.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>sb.classList.remove('open')));
}

function loginView(){
  return `<div class="login card">
    <h1>تسجيل الدخول</h1>
    <label>دخول كمدير — كلمة المرور</label>
    <input id="adminPass" type="password" style="width:100%" placeholder="كلمة المرور">
    <button class="btn" id="asAdmin" style="width:100%;margin-top:8px">دخول كمدير</button>
    <p id="adminErr" style="color:var(--bad);font-size:12px"></p>
    <hr style="margin:16px 0;border-color:var(--border)">
    <label>دخول كموظف — Employee ID أو البريد الإلكتروني</label>
    <input id="empLogin" style="width:100%" placeholder="EMP001 أو name@company.com">
    <button class="btn" id="asEmp" style="width:100%;margin-top:8px">دخول</button>
    <p id="loginErr" style="color:var(--bad);font-size:12px"></p>
  </div>`;
}

const DEFAULT_ADMIN_PASSWORD='8520';
async function getAdminPassword(){
  if(!db) return DEFAULT_ADMIN_PASSWORD;
  try{
    const doc = await db.collection('settings').doc('admin').get();
    if(!doc || !doc.exists) return DEFAULT_ADMIN_PASSWORD;
    const data = doc.data();
    return (data && data.password) ? data.password : DEFAULT_ADMIN_PASSWORD;
  }catch(e){ return DEFAULT_ADMIN_PASSWORD; }
}
function attachLogin(){
  document.getElementById('asAdmin').onclick=async ()=>{
    const btn=document.getElementById('asAdmin'); btn.disabled=true;
    const p=document.getElementById('adminPass').value;
    const current=await getAdminPassword();
    btn.disabled=false;
    if(p!==current){ document.getElementById('adminErr').textContent='كلمة المرور غير صحيحة.'; return; }
    state.session={role:'admin'}; state.view='dashboard'; render();
  };
  document.getElementById('adminPass').onkeydown=(e)=>{ if(e.key==='Enter') document.getElementById('asAdmin').click(); };
  document.getElementById('asEmp').onclick=async ()=>{
    const v=document.getElementById('empLogin').value.trim();
    if(!v){ document.getElementById('loginErr').textContent='أدخل Employee ID أو البريد الإلكتروني.'; return; }
    const emps = await listAll('employees');
    const emp = emps.find(e=>e.empId===v || e.email===v);
    if(emp){ state.session={role:'employee',...emp}; state.view='emp-home'; render(); }
    else document.getElementById('loginErr').textContent='لم يتم العثور على الموظف. تأكد من البيانات أو اطلب من المدير إضافتك.';
  };
}

window.addEventListener('hashchange', ()=>{
  const v=(location.hash||'#').slice(1);
  if(v==='logout'){ state.session=null; state.view='login'; location.hash=''; render(); return; }
  if(v) state.view=v;
  render();
});

async function routeRender(){
  const main=document.getElementById('main');
  main.innerHTML='<p style="color:var(--muted)">جارِ التحميل…</p>';
  const v=state.view;
  if(v==='dashboard') main.innerHTML=await dashboardView();
  else if(v==='create-exam'){ main.innerHTML=await createExamView(); attachCreateExam(); }
  else if(v==='questions'){ main.innerHTML=await questionsView(); attachQuestions(); }
  else if(v==='employees'){ main.innerHTML=await employeesView(); attachEmployees(); }
  else if(v==='assign'){ main.innerHTML=await assignView(); attachAssign(); }
  else if(v==='results'){ main.innerHTML=await resultsView(); attachResults(); }
  else if(v==='wrong-answers'){ main.innerHTML=await wrongAnswersView(); attachWrongAnswers(); }
  else if(v==='review-exams'){ main.innerHTML=await reviewExamsView(); attachReviewExams(); }
  else if(v==='settings'){ main.innerHTML=settingsView(); attachSettings(); }
  else if(v==='messages'){ main.innerHTML=await messagesView(); attachMessages(); }
  else if(v==='emp-messages'){ main.innerHTML=await empMessagesView(); attachEmpMessages(); }
  else if(v==='emp-home'){ main.innerHTML=await empHomeView(); attachEmpHome(); }
  else if(v==='emp-results'){ main.innerHTML=await empResultsView(); }
  else if(v==='take-exam'){ main.innerHTML=await takeExamView(); attachTakeExam(); }
  else main.innerHTML=await dashboardView();
}

// ---------- ADMIN: dashboard ----------
async function dashboardView(){
  const [emps,exams,results] = await Promise.all([listAll('employees'),listAll('exams'),listAll('results')]);
  const completed=results.length;
  const avg = completed? Math.round(results.reduce((a,r)=>a+(r.percent||0),0)/completed):0;
  const passRate = completed? Math.round(results.filter(r=>r.passed).length/completed*100):0;
  const assignments = await listAll('assignments');
  const pending = assignments.filter(a=>!results.some(r=>r.examId===a.examId && r.employeeId===a.employeeId)).length;
  return `<h1>لوحة التحكم</h1>
  <div class="grid">
    <div class="card"><div class="stat">${emps.length}</div><div class="stat-label">إجمالي الموظفين</div></div>
    <div class="card"><div class="stat">${exams.length}</div><div class="stat-label">إجمالي الاختبارات</div></div>
    <div class="card"><div class="stat">${completed}</div><div class="stat-label">اختبارات مكتملة</div></div>
    <div class="card"><div class="stat">${pending}</div><div class="stat-label">اختبارات معلقة</div></div>
    <div class="card"><div class="stat">${avg}%</div><div class="stat-label">متوسط الدرجات</div></div>
    <div class="card"><div class="stat">${passRate}%</div><div class="stat-label">نسبة النجاح</div></div>
  </div>
  <div class="card"><h3>آخر النتائج</h3>${resultsTable(results.slice(-8).reverse(),emps,exams)}</div>`;
}

function resultsTable(results,emps,exams,withChk){
  if(!results.length) return '<p style="color:var(--muted)">لا توجد نتائج بعد.</p>';
  return `<div class="table-wrap"><table><tr>${withChk?'<th><input type="checkbox" id="resSelectAll"></th>':''}<th>الموظف</th><th>الاختبار</th><th>النسبة</th><th>الحالة</th></tr>
  ${results.map(r=>{
    const e=emps.find(x=>x.id===r.employeeId); const ex=exams.find(x=>x.id===r.examId);
    return `<tr>${withChk?`<td><input type="checkbox" class="resChk" value="${r.id}"></td>`:''}<td>${e?e.name:'-'}</td><td>${ex?ex.name:'-'}</td><td>${r.percent}%</td>
    <td><span class="badge ${r.passed?'ok':'bad'}">${r.passed?'ناجح':'راسب'}</span></td></tr>`;
  }).join('')}</table></div>`;
}

// ---------- ADMIN: question bank ----------
async function questionsView(){
  const qs = await listAll('questions');
  return `<h1>بنك الأسئلة</h1>
  <div class="card">
    <div class="row">
      <div><label>نص السؤال</label><input id="qText" style="width:100%"></div>
      <div><label>النوع</label><select id="qType" style="width:100%">
        <option value="mcq">اختيار من متعدد</option><option value="tf">صح / خطأ</option>
        <option value="multi">اختيار متعدد</option><option value="short">إجابة قصيرة</option>
      </select></div>
      <div><label>التصنيف</label><input id="qCat" style="width:100%"></div>
      <div><label>الدرجة</label><input id="qPoints" type="number" value="1" style="width:100%"></div>
    </div>
    <div id="qOptsWrap"></div>
    <label>شرح الإجابة (اختياري)</label><input id="qExpl" style="width:100%">
    <button class="btn" id="addQ" style="margin-top:10px">إضافة السؤال</button>
  </div>
  <div class="card"><h3>كل الأسئلة (${qs.length})</h3>
  <input id="qSearch" placeholder="بحث..." style="width:100%;margin-bottom:8px">
  <button class="btn danger" id="qBulkDelete" style="margin-bottom:8px">حذف المحدد</button>
  <div id="qList">${renderQList(qs)}</div></div>`;
}
function renderQList(qs){
  if(!qs.length) return '<p style="color:var(--muted)">لا توجد أسئلة.</p>';
  return `<div class="table-wrap"><table><tr><th><input type="checkbox" id="qSelectAll"></th><th>السؤال</th><th>النوع</th><th>التصنيف</th><th>الدرجة</th><th></th></tr>
  ${qs.map(q=>`<tr><td><input type="checkbox" class="qChk" value="${q.id}"></td><td>${q.text}</td><td>${typeLabel(q.type)}</td><td>${q.category||'-'}</td><td>${q.points}</td>
  <td><button class="btn danger" data-del="${q.id}" style="padding:4px 10px">حذف</button></td></tr>`).join('')}</table></div>`;
}
function typeLabel(t){ return {mcq:'اختيار واحد',tf:'صح/خطأ',multi:'اختيار متعدد',short:'إجابة قصيرة'}[t]||t; }

function optsEditor(type){
  if(type==='tf') return `<label>الإجابة الصحيحة</label><select id="qCorrectTF"><option value="true">صح</option><option value="false">خطأ</option></select>`;
  if(type==='short') return `<label>الإجابة الصحيحة (نص)</label><input id="qShortAns" style="width:100%">`;
  // mcq / multi
  let html='<label>الاختيارات (علّم الصحيح)</label>';
  for(let i=0;i<4;i++){
    html+=`<div class="qopt"><input type="${type==='multi'?'checkbox':'radio'}" name="qc" value="${i}">
    <input data-opt="${i}" placeholder="اختيار ${i+1}" style="flex:1"></div>`;
  }
  return html;
}

function attachQuestions(){
  const typeSel=document.getElementById('qType');
  const wrap=document.getElementById('qOptsWrap');
  const refresh=()=>wrap.innerHTML=optsEditor(typeSel.value);
  typeSel.onchange=refresh; refresh();
  document.getElementById('addQ').onclick=async ()=>{
    const type=typeSel.value, text=document.getElementById('qText').value.trim();
    if(!text) return alert('أدخل نص السؤال');
    let options=[], correct=null;
    if(type==='tf'){ correct=document.getElementById('qCorrectTF').value==='true'; }
    else if(type==='short'){ correct=document.getElementById('qShortAns').value.trim(); }
    else {
      const opts=[...wrap.querySelectorAll('[data-opt]')].map(i=>i.value.trim());
      options=opts;
      if(type==='mcq'){ const r=wrap.querySelector('input[name=qc]:checked'); correct=r?parseInt(r.value):null; }
      else { correct=[...wrap.querySelectorAll('input[name=qc]:checked')].map(c=>parseInt(c.value)); }
    }
    const q={text,type,options,correct,points:parseFloat(document.getElementById('qPoints').value)||1,
      category:document.getElementById('qCat').value.trim(),explanation:document.getElementById('qExpl').value.trim()};
    await setDoc('questions',uid(),q);
    state.view='questions'; routeRender();
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ await delDoc('questions',b.dataset.del); state.view='questions'; routeRender(); });
  document.getElementById('qSearch').oninput=async (e)=>{
    const qs=await listAll('questions');
    const f=qs.filter(q=>q.text.includes(e.target.value)||((q.category||'').includes(e.target.value)));
    document.getElementById('qList').innerHTML=renderQList(f);
    attachSelectAll('qSelectAll','qChk');
  };
  document.getElementById('qBulkDelete').onclick=()=>bulkDeleteSelected('questions','qChk');
  attachSelectAll('qSelectAll','qChk');
}

// ---------- ADMIN: create exam ----------
async function createExamView(){
  const qs = await listAll('questions');
  return `<h1>إنشاء اختبار جديد</h1>
  <div class="card">
    <div class="row">
      <div><label>اسم الاختبار</label><input id="eName" style="width:100%"></div>
      <div><label>القسم / الفريق</label><input id="eDept" style="width:100%"></div>
    </div>
    <label>الوصف</label><input id="eDesc" style="width:100%">
    <div class="row">
      <div><label>المدة (دقائق)</label><input id="eDur" type="number" value="30" style="width:100%"></div>
      <div><label>درجة النجاح %</label><input id="ePass" type="number" value="60" style="width:100%"></div>
      <div><label>عدد المحاولات</label><input id="eAttempts" type="number" value="1" style="width:100%"></div>
    </div>
    <div class="row">
      <div><label>تاريخ البداية</label><input id="eStart" type="date" style="width:100%"></div>
      <div><label>تاريخ النهاية</label><input id="eEnd" type="date" style="width:100%"></div>
    </div>
    <div class="row">
      <div><label><input type="checkbox" id="eRandomQ"> ترتيب عشوائي للأسئلة</label></div>
      <div><label><input type="checkbox" id="eRandomA"> ترتيب عشوائي للاختيارات</label></div>
      <div><label><input type="checkbox" id="eShowResult" checked> إظهار النتيجة للموظف</label></div>
      <div><label><input type="checkbox" id="eShowAns"> إظهار الإجابات الصحيحة</label></div>

// ---------- ADMIN: wrong answers ----------
function formatAnswerText(q,val){
  if(val===undefined||val===null||val==='') return '<span style="color:var(--muted)">لم يُجب</span>';
  if(q.type==='mcq') return (q.options&&q.options[val]!==undefined)? q.options[val] : String(val);
  if(q.type==='tf') return val===true?'صح':'خطأ';
  if(q.type==='multi') return Array.isArray(val)? val.map(i=>(q.options&&q.options[i]!==undefined)?q.options[i]:i).join('، ') : String(val);
  return String(val);
}
function formatCorrectText(q){
  if(q.type==='mcq') return (q.options&&q.options[q.correct]!==undefined)? q.options[q.correct] : String(q.correct);
  if(q.type==='tf') return q.correct===true?'صح':'خطأ';
  if(q.type==='multi') return Array.isArray(q.correct)? q.correct.map(i=>(q.options&&q.options[i]!==undefined)?q.options[i]:i).join('، ') : String(q.correct);
  return String(q.correct);
}
function isAnswerWrong(q,val){
  if(val===undefined||val===null||val==='') return false; // unanswered: not counted as "answered incorrectly"
  if(q.type==='mcq') return val!==q.correct;
  if(q.type==='tf') return val!==q.correct;
  if(q.type==='multi'){
    if(!Array.isArray(val)||!Array.isArray(q.correct)) return true;
    return !(val.length===q.correct.length && val.every(v=>q.correct.includes(v)));
  }
  if(q.type==='short') return (String(val).trim().toLowerCase())!==(String(q.correct||'').trim().toLowerCase());
  return false;
}
async function buildWrongAnswerRows(){
  const [results,emps,exams,questions]=await Promise.all([listAll('results'),listAll('employees'),listAll('exams'),listAll('questions')]);
  const rows=[];
  results.forEach(r=>{
    const emp=emps.find(e=>e.id===r.employeeId), exam=exams.find(x=>x.id===r.examId);
    if(!exam) return;
    (exam.questionIds||[]).forEach(qid=>{
      const q=questions.find(x=>x.id===qid); if(!q) return;
      const val=r.answers?r.answers[q.id]:undefined;
      if(isAnswerWrong(q,val)){
        rows.push({
          employeeName: emp?emp.name:'(موظف محذوف)',
          empId: emp?emp.empId:'-',
          examName: exam.name,
          questionText: q.text,
          employeeAnswer: formatAnswerText(q,val),
          correctAnswer: formatCorrectText(q),
          when: r.endTime || r.startTime || 0
        });
      }
    });
  });
  rows.sort((a,b)=>b.when-a.when);
  return rows;
}
function renderWrongAnswerTable(rows){
  if(!rows.length) return '<p style="color:var(--muted)">لا توجد إجابات خاطئة مسجّلة حتى الآن.</p>';
  return `<div class="table-wrap"><table><tr><th>الموظف</th><th>Employee ID</th><th>الاختبار</th><th>السؤال</th><th>إجابة الموظف</th><th>الإجابة الصحيحة</th><th>التاريخ</th></tr>
  ${rows.map(r=>`<tr><td>${r.employeeName}</td><td>${r.empId}</td><td>${r.examName}</td><td>${r.questionText}</td>
  <td style="color:var(--bad)">${r.employeeAnswer}</td><td style="color:var(--ok)">${r.correctAnswer}</td>
  <td>${r.when?new Date(r.when).toLocaleString('ar-EG'):'-'}</td></tr>`).join('')}</table></div>`;
}
async function wrongAnswersView(){
  const rows=await buildWrongAnswerRows();
  return `<h1>الإجابات الخاطئة</h1>
  <div class="card">
    <p style="color:var(--muted);font-size:13px">كل الأسئلة التي أجاب عليها الموظفون إجابة خاطئة بعد انتهاء اختباراتهم، مع توضيح من أجاب وبأي إجابة.</p>
    <div class="row">
      <div><input id="waSearch" placeholder="بحث باسم الموظف أو اسم الاختبار..." style="width:100%"></div>
      <div><button class="btn sec" id="waExport">تصدير CSV</button></div>
    </div>
    <div id="waList" style="margin-top:10px">${renderWrongAnswerTable(rows)}</div>
  </div>`;
}
function attachWrongAnswers(){
  document.getElementById('waSearch').oninput=async (e)=>{
    const rows=await buildWrongAnswerRows();
    const term=e.target.value.trim();
    const f=term? rows.filter(r=>r.employeeName.includes(term)||r.examName.includes(term)) : rows;
    document.getElementById('waList').innerHTML=renderWrongAnswerTable(f);
  };
  document.getElementById('waExport').onclick=async ()=>{
    const rows=await buildWrongAnswerRows();
    let csv='Employee,Employee ID,Exam,Question,Employee Answer,Correct Answer,Date\n';
    rows.forEach(r=>{
      const esc=(s)=>'"'+String(s).replace(/<[^>]+>/g,'').replace(/"/g,'""')+'"';
      csv+=`${esc(r.employeeName)},${esc(r.empId)},${esc(r.examName)},${esc(r.questionText)},${esc(r.employeeAnswer)},${esc(r.correctAnswer)},${esc(r.when?new Date(r.when).toLocaleString('ar-EG'):'-')}\n`;
    });
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='wrong-answers.csv'; a.click(); URL.revokeObjectURL(url);
  };
}

    }
    btn.disabled=false; btn.textContent='حذف كل البيانات (عدا بنك الأسئلة وبيانات الموظفين)';
    wmsg.style.color='var(--ok)'; wmsg.textContent='تم حذف كل البيانات بنجاح، وبقي بنك الأسئلة وبيانات الموظفين كما هي.';
  };
}

// ---------- ADMIN: messages ----------
async function messagesView(){
  const [emps,exams,messages]=await Promise.all([listAll('employees'),listAll('exams'),listAll('messages')]);
  const sorted=[...messages].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const msgHtml = sorted.map(m=>{
    const recipients = m.toEmployeeId==='all' ? emps : emps.filter(e=>e.id===m.toEmployeeId);
    const seenCount = recipients.filter(e=>m.seenBy && m.seenBy[e.id]).length;
    const seenListHtml = recipients.map(e=>{
      const seenAt=m.seenBy && m.seenBy[e.id];
      return `<tr><td>${e.name}</td><td>${seenAt? '<span class="badge ok">شاهدها في '+new Date(seenAt).toLocaleString('ar-EG')+'</span>' : '<span class="badge warn">لم تُشاهد بعد</span>'}</td></tr>`;
    }).join('');
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap">
        <strong>${m.subject}</strong>
        <small style="color:var(--muted)">${m.createdAt?new Date(m.createdAt).toLocaleString('ar-EG'):''}</small>
      </div>
      <p style="margin:8px 0">${m.body}</p>
      <p style="font-size:12px;color:var(--muted)">إلى: ${m.toEmployeeId==='all'?'كل الموظفين':(recipients[0]?recipients[0].name:'(موظف محذوف)')} — شاهدها ${seenCount} من ${recipients.length}</p>
      <button class="btn sec" data-toggleseen="${m.id}" style="padding:4px 10px">رآيه</button>
      <div class="table-wrap" id="seen-${m.id}" style="display:none;margin-top:8px"><table><tr><th>الموظف</th><th>الحالة</th></tr>${seenListHtml}</table></div>
    </div>`;
  }).join('');
  return `<h1>مراسلات</h1>
  <div class="card">
    <h3>إرسال إرشادات للموظفين</h3>
    <div class="row">
      <div><label>المرسل إليه</label><select id="mTo"><option value="all">-- كل الموظفين --</option>${emps.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select></div>
      <div><label>مرتبط باختبار (اختياري)</label><select id="mExam"><option value="">-- بدون --</option>${exams.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div>
    </div>
    <label>عنوان الرسالة</label><input id="mSubject" style="width:100%">
    <label>نص الإرشادات</label><textarea id="mBody" rows="4" style="width:100%"></textarea>
    <button class="btn" id="sendMsg" style="margin-top:8px">إرسال</button>
  </div>
  <h3>الرسائل المرسلة</h3>
  ${msgHtml || '<p style="color:var(--muted)">لا توجد رسائل مرسلة بعد.</p>'}`;
}
function attachMessages(){
  document.getElementById('sendMsg').onclick=async ()=>{
    const subject=document.getElementById('mSubject').value.trim();
    const body=document.getElementById('mBody').value.trim();
    if(!subject||!body){ alert('أدخل عنوان الرسالة ونصها.'); return; }
    const toEmployeeId=document.getElementById('mTo').value;
    const examId=document.getElementById('mExam').value;
    await setDoc('messages',uid(),{toEmployeeId,examId:examId||null,subject,body,createdAt:Date.now(),seenBy:{}});
    state.view='messages'; routeRender();
  };
  document.querySelectorAll('[data-toggleseen]').forEach(b=>b.onclick=()=>{
    const box=document.getElementById('seen-'+b.dataset.toggleseen);
    box.style.display = box.style.display==='none'?'block':'none';
  });
}

// ---------- EMPLOYEE: home ----------
async function empHomeView(){
  const s=state.session;
  const [assignments,results,exams]=await Promise.all([listAll('assignments'),listAll('results'),listAll('exams')]);
  const mine=assignments.filter(a=>a.employeeId===s.id);
  const now=Date.now();
  const rows=mine.map(a=>{
    const ex=exams.find(x=>x.id===a.examId); if(!ex) return null;
    const myResults=results.filter(r=>r.examId===ex.id && r.employeeId===s.id);
    const done=myResults.length>=(ex.attempts||1);
    const late = a.deadline && new Date(a.deadline).getTime()<now && !done;
    return {ex,a,done,late,attemptsUsed:myResults.length};
  }).filter(Boolean);
  return `<h1>مرحبًا، ${s.name}</h1>
  <div class="card"><h3>الاختبارات المسندة إليك</h3>
  <table><tr><th>الاختبار</th><th>الموعد النهائي</th><th>الحالة</th><th></th></tr>
  ${rows.map(r=>`<tr><td>${r.ex.name}</td><td>${r.a.deadline||'-'}</td>
    <td>${r.done?'<span class="badge ok">مكتمل</span>':r.late?'<span class="badge bad">متأخر</span>':'<span class="badge warn">قيد الانتظار</span>'}</td>
    <td>${!r.done?`<button class="btn" data-start="${r.ex.id}" style="padding:5px 10px">بدء الاختبار</button>`:''}</td></tr>`).join('') || '<tr><td colspan=4 style="color:var(--muted)">لا توجد اختبارات مسندة.</td></tr>'}
  </table></div>`;
}

// ---------- EMPLOYEE: take exam ----------
let timerInterval=null;
async function takeExamView(){
  const exams=await listAll('exams'); const exam=exams.find(e=>e.id===state.examAttempt.examId);
  if(!exam) return '<p>الاختبار غير موجود.</p>';
  const allQs=await listAll('questions');
  let qs = exam.questionIds.map(id=>allQs.find(q=>q.id===id)).filter(Boolean);
  if(!state.examAttempt.order){
    let order=qs.map((_,i)=>i);
    if(exam.randomQ) order.sort(()=>Math.random()-0.5);
    state.examAttempt.order=order;
    state.examAttempt.endAt=Date.now()+exam.duration*60000;
  }
  state.examAttempt.qs=qs;
  const order=state.examAttempt.order;
  const i=state.examAttempt.idx;
  const q=qs[order[i]];
  const answers=state.examAttempt.answers;
  return `<h1>${exam.name}</h1>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div>السؤال ${i+1} من ${qs.length}</div><div class="timer" id="timerBox">--:--</div>
  </div>
  <div class="card">
    <p style="font-size:15px">${q.text}</p>
    <div id="answerArea">${answerInput(q,answers[q.id])}</div>
  </div>
  <div class="card">
    <button class="btn sec" id="prevQ" ${i===0?'disabled':''}>السابق</button>
    <button class="btn sec" id="nextQ" ${i===qs.length-1?'disabled':''}>التالي</button>
    <button class="btn" id="submitExam" style="float:left">تسليم الاختبار</button>
  </div>
  <div class="card qnav">${order.map((oi,pos)=>`<button class="${answers[qs[oi].id]!==undefined?'answered':''} ${pos===i?'current':''}" data-jump="${pos}">${pos+1}</button>`).join('')}</div>`;
}
function answerInput(q,val){
  if(q.type==='mcq'||q.type==='tf'){
    const opts = q.type==='tf'? ['صح','خطأ'] : q.options;
    return opts.map((o,idx)=>{
      const v=q.type==='tf'? (idx===0?'true':'false') : idx;
      return `<div class="qopt"><input type="radio" name="ans" value="${v}" ${String(val)===String(v)?'checked':''}><span>${o}</span></div>`;
    }).join('');
  }
  if(q.type==='multi'){
    return q.options.map((o,idx)=>`<div class="qopt"><input type="checkbox" name="ansM" value="${idx}" ${Array.isArray(val)&&val.includes(idx)?'checked':''}><span>${o}</span></div>`).join('');
  }
  return `<input id="ansShort" style="width:100%" value="${val||''}">`;
}
function saveCurrentAnswer(){
  const ea=state.examAttempt; const q=ea.qs[ea.order[ea.idx]];
  if(q.type==='mcq'||q.type==='tf'){ const r=document.querySelector('input[name=ans]:checked'); if(r) ea.answers[q.id]= q.type==='tf'? r.value==='true' : parseInt(r.value); }
  else if(q.type==='multi'){ const cs=[...document.querySelectorAll('input[name=ansM]:checked')].map(c=>parseInt(c.value)); if(cs.length) ea.answers[q.id]=cs; }
  else { const el=document.getElementById('ansShort'); if(el) ea.answers[q.id]=el.value; }
}
function attachTakeExam(){
  const ea=state.examAttempt;
  clearInterval(timerInterval);
  const tick=()=>{
    const left=ea.endAt-Date.now();
    const box=document.getElementById('timerBox'); if(!box) return;
    if(left<=0){ clearInterval(timerInterval); finishExam(); return; }
    const m=Math.floor(left/60000), s2=Math.floor((left%60000)/1000);
    box.textContent=`${m}:${s2.toString().padStart(2,'0')}`;
  };
  tick(); timerInterval=setInterval(tick,1000);
  document.getElementById('prevQ').onclick=()=>{ saveCurrentAnswer(); ea.idx--; state.view='take-exam'; routeRender(); };
  document.getElementById('nextQ').onclick=()=>{ saveCurrentAnswer(); ea.idx++; state.view='take-exam'; routeRender(); };
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{ saveCurrentAnswer(); ea.idx=parseInt(b.dataset.jump); state.view='take-exam'; routeRender(); });
  document.getElementById('submitExam').onclick=()=>{ saveCurrentAnswer(); if(confirm('هل أنت متأكد من تسليم الاختبار؟')) finishExam(); };
}
async function finishExam(){
  clearInterval(timerInterval);
  const ea=state.examAttempt; const exams=await listAll('exams'); const exam=exams.find(e=>e.id===ea.examId);
  let score=0,total=0;
  ea.qs.forEach(q=>{
    total+=q.points; const a=ea.answers[q.id];
    if(q.type==='mcq'){ if(a===q.correct) score+=q.points; }
    else if(q.type==='tf'){ if(a===q.correct) score+=q.points; }
    else if(q.type==='multi'){ if(Array.isArray(a)&&Array.isArray(q.correct)&&a.length===q.correct.length&&a.every(v=>q.correct.includes(v))) score+=q.points; }
    else if(q.type==='short'){ if((a||'').trim().toLowerCase()===((q.correct||'').trim().toLowerCase())) score+=q.points; }
  });
  const percent = total? Math.round(score/total*100):0;
  const passed = percent>=exam.passScore;
  const prevResults=(await listAll('results')).filter(r=>r.examId===exam.id && r.employeeId===state.session.id);
  await setDoc('results',uid(),{examId:exam.id,employeeId:state.session.id,score,percent,passed,
    startTime:ea.startTime,endTime:Date.now(),durationSec:Math.round((Date.now()-ea.startTime)/1000),
    attemptNum:prevResults.length+1, answers:ea.answers});
  state.examAttempt=null;
  alert(exam.showResult? `انتهى الاختبار. النتيجة: ${percent}% - ${passed?'ناجح':'راسب'}` : 'تم تسليم الاختبار بنجاح.');
  state.view='emp-home'; location.hash='emp-home'; routeRender();
}
